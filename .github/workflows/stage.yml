# =============================================================================
# Stage: Test, Build & Deploy (Plane Orca Stage)
# =============================================================================
#
# When: You push to the "stage" branch or open a pull request targeting "stage".
# Where: Runs on GitHub Actions runners (ubuntu-latest).
#
# What happens:
#   • CI check: Runs oxfmt and oxlint checks to enforce code standards.
#   • Build & Push: Builds the web, api, space, live, and proxy images, and
#     pushes them to GitHub Container Registry (GHCR) tagged as :stage.
#     Also performs pre/post-build Docker runner pruning hygiene.
#   • Deploy: Triggers Coolify stage deployment, polls state until completion,
#     and outputs step summaries or issues cancellations.
#
# Deployment is opt-in:
#   The Coolify deploy job only runs when the repository (or "stage"
#   environment) variable COOLIFY_DEPLOY_ENABLED is set to the string "true".
#   Leave it unset and the whole workflow still runs — lint, build and push to
#   GHCR — while the deploy job is skipped instead of failing on absent
#   credentials. The deploy code below is kept intact so turning the variable
#   on is the only step needed to resume deploying.
#
# What you need in GitHub Secrets (only when COOLIFY_DEPLOY_ENABLED is "true"):
#   • COOLIFY_DEPLOY_URL - Full stage deploy URL with uuid parameter.
#   • COOLIFY_API_TOKEN  - Authorization bearer token for your Coolify API.
#
# Environment Configuration:
#   • Targets the GitHub Environment named "stage" to resolve secrets.
#
# =============================================================================

name: Staging CI/CD

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the three jobs that write (labeler, build-push,
# promote-rc) widen it themselves, so a step added to any other job cannot
# quietly push a commit or a package.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      space: ${{ steps.filter.outputs.space }}
      api: ${{ steps.filter.outputs.api }}
      live: ${{ steps.filter.outputs.live }}
      proxy: ${{ steps.filter.outputs.proxy }}
      code_changes: ${{ steps.filter.outputs.code_changes }}
      any_changed: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            space:
              - 'apps/space/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/stage.yml'
            live:
              - 'apps/live/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            config:
              - 'docker-compose-orca.yml'
              - '.github/workflows/stage.yml'
            proxy:
              - 'apps/proxy/**'
              - '.github/workflows/stage.yml'
            code_changes:
              - 'apps/web/**'
              - 'apps/admin/**'
              - 'apps/space/**'
              - 'apps/live/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  # ---------------------------------------------------------------------------
  # PR Labeler & Template Manager (Pull Requests ONLY)
  # ---------------------------------------------------------------------------
  labeler:
    name: Auto Label & Template PR
    if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'release-please--') && github.event.pull_request.head.ref != 'stage' && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      # Rewrites the PR body and its labels; it never writes to the repository.
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Base Branch Code
        uses: actions/checkout@v7

      - name: Update PR Properties
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/labels" \
            -d '{"name":"stage-pr","color":"bfd4f2","description":"Staging Pull Request"}' || true

          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -d '{"labels":["stage-pr"]}' || true

          CURRENT_BODY=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | python3 -c "import sys, json; print(json.load(sys.stdin).get('body','') or '')" 2>/dev/null || true)

          if [ -z "$(echo "$CURRENT_BODY" | tr -d '[:space:]')" ] || echo "$CURRENT_BODY" | grep -q "READ THIS BEFORE CREATING YOUR PULL REQUEST"; then
            if [ -f .github/PULL_REQUEST_TEMPLATE/basic.md ]; then
              PR_BODY=$(cat .github/PULL_REQUEST_TEMPLATE/basic.md)
              export PR_BODY PR_NUMBER GH_TOKEN GITHUB_API_URL GITHUB_REPOSITORY
              python3 << 'PY'
          import os, json, urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}"
          token = os.environ['GH_TOKEN']
          body = os.environ['PR_BODY']

          payload = json.dumps({'body': body}).encode('utf-8')
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}

          req = urllib.request.Request(url, data=payload, headers=headers, method='PATCH')
          try:
              with urllib.request.urlopen(req) as resp:
                  pass
          except Exception:
              pass
          PY
            fi
          fi

  ci:
    name: Code Quality Checks (CI)
    needs: changes
    if: ${{ needs.changes.outputs.code_changes == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Format and Lint Checks
        run: |
          pnpm check:format
          pnpm check:lint

      # The i18n catalogue is only as good as its weakest locale: a key added to
      # en/ and forgotten everywhere else renders the raw key string to whoever
      # runs that language. sync-check compares every locale against English and
      # also catches cross-namespace collisions and path conflicts, neither of
      # which surfaces at runtime until the wrong string appears on screen.
      # Cheap (reads JSON, no build), so it runs before the type checks.
      - name: Run i18n Catalogue Sync Check
        run: pnpm check:sync

      # Turbo builds the workspace packages first (check:types dependsOn ^build),
      # so this catches type errors the format and lint passes cannot see.
      - name: Run Type Checks
        run: pnpm check:types

  # ---------------------------------------------------------------------------
  # Backend tests. The Orca organizational layer materializes native
  # ProjectMember rows, so its tests assert against real rows in a real
  # PostgreSQL database — partial unique indexes and soft-delete behavior do not
  # reproduce on SQLite or against mocks.
  # ---------------------------------------------------------------------------
  api_tests:
    name: API Tests (pytest)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plane -d plane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # plane/__init__.py imports plane.celery, which calls redis_instance() at
      # module scope — so importing anything from plane needs REDIS_URL to be a
      # parseable URL before a single test is collected. Valkey, matching
      # docker-compose-test.yml.
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://plane:plane@localhost:5432/plane_test
      REDIS_URL: redis://localhost:6379/
      SECRET_KEY: stage-ci-secret-key-not-used-outside-tests
      DJANGO_SETTINGS_MODULE: plane.settings.test
      # Project creation reads these; without them the serializer raises and
      # every test that creates a project fails with an opaque 500.
      APP_BASE_URL: http://localhost:3000
      WEB_URL: http://localhost:3000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      # Scoped to the Orca suite: it is the fork's own surface and is verified
      # green against this configuration. The upstream contract and smoke
      # suites reach for services this job does not stand up (object storage
      # among them), so widening the path is a separate change that has to
      # provision them first — not something to switch on untested here, where
      # a pre-existing failure would block every build.
      - name: Run Orca Tests
        working-directory: ./apps/api
        run: pytest plane/tests/unit/orca/ -q

  build-push:
    name: Build & Push ${{ matrix.service }}
    needs: [ci, api_tests, changes]
    # `ci` and `api_tests` are each scoped to the paths they cover, so either
    # may legitimately be skipped — a web-only change skips api_tests, and a
    # config-only change skips ci. A skipped dependency would normally skip
    # this job too, which would stop the build for exactly those changes, so
    # the gate is on `failure` rather than on completion.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && (needs.changes.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            file: ./apps/web/Dockerfile.web
          - service: api
            context: ./apps/api
            file: ./apps/api/Dockerfile.api
          - service: space
            context: .
            file: ./apps/space/Dockerfile.space
          - service: admin
            context: .
            file: ./apps/admin/Dockerfile.admin
          - service: live
            context: .
            file: ./apps/live/Dockerfile.live
          - service: proxy
            context: ./apps/proxy
            file: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout Code
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7

      - name: Lowercase Image Name
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # ORCA CUSTOM FEATURE: a pull request builds but never authenticates to the
      # registry, so a PR cannot reach the tags staging deploys from.
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' && (needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch') }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/setup-buildx-action@v4

      - name: Pre-build Runner Hygiene Cleanup
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Running pre-build Docker cleanup..."
          docker container prune -f
          docker image prune -a -f --filter "until=24h"
          docker builder prune -a -f --filter "until=24h"

      # A pull request gets a throwaway tag it never pushes; a push to stage gets
      # both the mutable :stage pointer the staging environment follows and an
      # immutable :sha-<commit> tag, which is what production promotes from
      # (prod.yml). Same build, same digest, two names.
      - name: Compose Image Tags
        id: tags
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}/${{ matrix.service }}"
          {
            echo 'IMAGE_TAGS<<TAGS_EOF'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "${image}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
            else
              echo "${image}:stage"
              echo "${image}:sha-${{ github.sha }}"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_ENV"

      - name: Build and Push ${{ matrix.service }}
        id: build
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # The build still runs on a pull request — it is the proof the image
          # compiles — but nothing leaves the runner.
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is what production promotes by, so it is recorded per service
      # and merged into one artifact by the collect-digests job below.
      - name: Record Image Digest
        if: ${{ github.event_name != 'pull_request' && (needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '{"%s": "%s"}\n' "${{ matrix.service }}" "${{ steps.build.outputs.digest }}" \
            > "digests/${{ matrix.service }}.json"
          cat "digests/${{ matrix.service }}.json"

      - name: Upload Image Digest
        if: ${{ github.event_name != 'pull_request' && (needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.json
          retention-days: 90

      - name: Post-build Runner Hygiene Cleanup
        if: ${{ always() && (needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          echo "Running post-build Docker cleanup..."
          docker container prune -f
          docker image prune -f
          docker builder prune -f

  # ---------------------------------------------------------------------------
  # Collect the digests this run produced. Production promotes by digest rather
  # than by the mutable :stage tag (prod.yml), so the run that built the images
  # is the one that has to say, on the record, which digests they are.
  # ---------------------------------------------------------------------------
  collect-digests:
    name: Collect Image Digests
    needs: [build-push, changes]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build-push.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.merge.outputs.digests }}
    steps:
      - name: Download Per-Service Digests
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true

      - name: Merge Digests
        id: merge
        run: |
          set -euo pipefail
          python3 - <<'PY_MERGE'
          import json, os, pathlib

          merged = {}
          for path in sorted(pathlib.Path("digests").glob("*.json")) if pathlib.Path("digests").exists() else []:
              with path.open() as handle:
                  merged.update(json.load(handle))

          with open("image-digests.json", "w") as handle:
              json.dump(merged, handle, indent=2, sort_keys=True)

          compact = json.dumps(merged, separators=(",", ":"), sort_keys=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"digests={compact}\n")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as handle:
                  handle.write("## Image digests\n\n| Service | Digest |\n|---|---|\n")
                  for service, digest in sorted(merged.items()):
                      handle.write(f"| {service} | `{digest}` |\n")
                  if not merged:
                      handle.write("| _none_ | this run built no images |\n")
          PY_MERGE
          cat image-digests.json

      - name: Upload Merged Digests
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.json
          retention-days: 90

  deploy:
    name: Deploy to Stage (Coolify)
    needs: [build-push, changes, collect-digests]
    if: ${{ always() && vars.COOLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') && (needs.changes.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch') && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
    steps:
      # What staging is about to run, by digest — the same values production
      # will promote from later, so a mismatch is visible here first.
      - name: Log Image Digests
        run: |
          digests='${{ needs.collect-digests.outputs.digests }}'
          if [ -z "$digests" ] || [ "$digests" = "{}" ]; then
            echo "No images were built in this run; Coolify will redeploy the current :stage tags."
          else
            echo "Deploying these digests:"
            echo "$digests" | python3 -m json.tool
          fi

      - name: Trigger Coolify deploy
        id: deploy
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          if [ -z "$deploy_url" ]; then
            echo "::error::COOLIFY_DEPLOY_URL is empty."
            exit 1
          fi
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          uuid="${deploy_url#*uuid=}"
          uuid="${uuid%%&*}"
          success=0
          for i in 1 2 3; do
            if resp=$(curl -f -sS --max-time 30 -X POST "${base}/deploy" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\": \"${uuid}\"}"); then
              success=1
              echo "$resp" > deploy_response.json
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Wait for deployment
        id: wait
        if: success()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then
            echo "::error::Could not read deployment UUID."
            exit 1
          fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          token="${{ secrets.COOLIFY_API_TOKEN }}"
          timeout_sec=900
          interval=20
          elapsed=0
          while [ $elapsed -lt $timeout_sec ]; do
            curl -sS --max-time 30 -X GET "${base}/deployments/${dep_uuid}" \
              -H "Authorization: Bearer ${token}" -o deployment.json 2>/dev/null || true
            status=$(python3 -c "
          import json
          try:
              print(json.load(open('deployment.json')).get('status','').lower())
          except Exception:
              print('')
          " 2>/dev/null || true)
            case "$status" in
              finished|success) break ;;
              failed|cancelled|cancelled-by-user) echo "Coolify deployment failed or was cancelled: $status"; exit 1 ;;
              *) ;;
            esac
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $elapsed -ge $timeout_sec ]; then
            echo "Deployment did not finish within ${timeout_sec}s"
            exit 1
          fi
          echo "elapsed_sec=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        if: success() && steps.wait.outcome == 'success'
        env:
          ELAPSED_SEC: ${{ steps.wait.outputs.elapsed_sec }}
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          dashboard="${base%/api/v1}"
          [ "$dashboard" = "$base" ] && dashboard="${base%/api}"
          export DASHBOARD="$dashboard"
          export GITHUB_SERVER_URL="${{ github.server_url }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          export ELAPSED_SEC="${ELAPSED_SEC:-0}"
          python3 << 'PY'
          import json, os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          dashboard = (os.environ.get('DASHBOARD') or '').rstrip('/')
          gh_server = os.environ.get('GITHUB_SERVER_URL', '')
          gh_repo = os.environ.get('GITHUB_REPOSITORY', '')
          gh_sha = os.environ.get('GITHUB_SHA', '')
          branch = os.environ.get('GITHUB_REF_NAME', '—')
          try:
              elapsed_sec = int(os.environ.get('ELAPSED_SEC', 0))
          except Exception:
              elapsed_sec = 0
          def format_duration(s):
              if s < 60:
                  return f'{s}s'
              m, s = divmod(s, 60)
              return f'{m}m {s}s' if s else f'{m}m'
          deploy_duration = format_duration(elapsed_sec) if elapsed_sec else '—'
          try:
              with open('deployment.json') as f:
                  d = json.load(f)
          except Exception:
              d = {}
          app = d.get('application_name', 'N/A')
          status = (d.get('status') or 'N/A').lower()
          status_display = '✅ ' + status if status in ('finished', 'success') else status
          coolify_path = (d.get('deployment_url') or '').strip()
          if coolify_path and dashboard and not (coolify_path.startswith('http://') or coolify_path.startswith('https://')):
              full_coolify_url = dashboard + coolify_path if coolify_path.startswith('/') else coolify_path
          else:
              full_coolify_url = dashboard if dashboard else ''
          coolify_url_cell = f'[Link]({full_coolify_url})' if full_coolify_url else '—'
          commit = d.get('commit') or d.get('commit_message') or gh_sha or '—'
          commit_sha = (d.get('commit') or gh_sha or '').strip()
          if commit_sha and gh_server and gh_repo:
              short_sha = commit_sha[:7] if len(commit_sha) >= 7 else commit_sha
              commit_cell = f'[{short_sha}]({gh_server}/{gh_repo}/commit/{commit_sha})'
          else:
              commit_cell = commit
          lines = [
              '## Coolify deployment',
              '',
              '| Property | Value |',
              '|---|-----|',
              f'| **Application** | {app} |',
              f'| **Status** | {status_display} |',
              f'| **Branch** | {branch} |',
              f'| **Deploy duration** | {deploy_duration} |',
              f'| **Commit** | {commit_cell} |',
              f'| **Coolify URL** | {coolify_url_cell} |',
              '',
          ]
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write('\n'.join(lines) + '\n')
          PY

      - name: Cancel Coolify deployment (if job cancelled)
        if: cancelled()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then exit 0; fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          curl -sS --max-time 15 -X POST "${base}/deployments/${dep_uuid}/cancel" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" || true

      - name: Deployment failed summary
        if: failure()
        run: |
          branch="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          repo="${{ github.repository }}"
          server="${{ github.server_url }}"
          commit_link="[${short_sha}](${server}/${repo}/commit/${sha})"
          {
            echo '## Deployment failed'
            echo ''
            echo 'Deployment failed, was cancelled, or timed out.'
            echo ''
            echo '| | |'
            echo '|---|-----|'
            echo "| **Branch** | ${branch} |"
            echo "| **Commit** | ${commit_link} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Maintain Release Candidate PR (Pushes ONLY — Runs in Parallel)
  # ---------------------------------------------------------------------------
  promote-rc:
    name: Ensure Release Candidate PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Reads the repository, opens and assigns the release-candidate PR.
      # It never writes to a branch.
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: stage
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Skip if post-release sync commit
        id: sync-guard
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s HEAD)
          echo "Latest commit: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -qE "\[skip ci\]|^orca-chore: sync prod"; then
            echo "Post-release sync commit detected — skipping RC PR maintenance."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # ORCA CUSTOM FEATURE: this job is the only signal that the release
      # candidate exists, so it either creates the PR, finds it, or fails.
      # It used to swallow every error (curl without -f, `|| true`, exit 0 on
      # paths that confirmed nothing) and reported success with no PR at all.
      - name: Maintain Release Candidate PR
        if: steps.sync-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ASSIGNEE_VAR: ${{ vars.RELEASE_ASSIGNEE }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          TARGET_ASSIGNEE="${RELEASE_ASSIGNEE_VAR:-$ACTOR}"
          # The only tolerated failure in this job: prod may not exist yet on a
          # fresh clone, and the count below then has nothing to compare against.
          git fetch origin prod || true

          if ! git rev-parse --verify --quiet origin/prod >/dev/null; then
            echo "::error::origin/prod does not exist; cannot determine whether a release candidate is due"
            exit 1
          fi

          COMMITS_AHEAD=$(git rev-list --count origin/prod..stage)
          echo "Commits on stage ahead of prod: $COMMITS_AHEAD"

          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "Stage is level with prod. No release candidate is due."
            exit 0
          fi

          VERSION=$(python3 -c "import json; print(json.load(open('package.json')).get('version', ''))")
          if [ -n "$VERSION" ]; then
            PR_TITLE="release: Promote Release Candidate from v${VERSION}"
          else
            PR_TITLE="release: Promote Release Candidate"
          fi
          echo "Current package version: ${VERSION:-unknown}"

          PR_NUMBER=$(gh pr list --base prod --head stage --state open --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "Release candidate PR #${PR_NUMBER} already open."
          else
            echo "No open release candidate PR. Creating one from stage to prod..."
            BODY_FILE=.github/PULL_REQUEST_TEMPLATE/release_candidate.md
            if [ ! -f "$BODY_FILE" ]; then
              BODY_FILE=$(mktemp)
              echo "Promote Release Candidate changes from stage to prod." > "$BODY_FILE"
            fi
            # A failure here is the interesting case: most often the repository
            # setting "Allow GitHub Actions to create and approve pull requests"
            # is off (see docs/release-runbook.md).
            gh pr create --base prod --head stage --title "$PR_TITLE" --body-file "$BODY_FILE"
            PR_NUMBER=$(gh pr list --base prod --head stage --state open --json number --jq '.[0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Release candidate PR was neither found nor created"
            exit 1
          fi

          if [ -n "$TARGET_ASSIGNEE" ]; then
            gh pr edit "$PR_NUMBER" --add-assignee "$TARGET_ASSIGNEE"
          fi

          echo "Release candidate PR #${PR_NUMBER} is open and assigned to ${TARGET_ASSIGNEE}."
          {
            echo "## Release candidate"
            echo ""
            echo "PR [#${PR_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}) — ${COMMITS_AHEAD} commit(s) ahead of prod."
          } >> "$GITHUB_STEP_SUMMARY"
