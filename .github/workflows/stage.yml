# =============================================================================
# Stage: Test, Build & Deploy (Plane Orca Stage)
# =============================================================================
#
# When: You push to the "stage" branch or open a pull request targeting "stage".
# Where: Runs on GitHub Actions runners (ubuntu-latest).
#
# What happens:
#   • CI check: Runs oxfmt and oxlint checks to enforce code standards.
#   • Build & Push: Builds the web, api, space, live, and proxy images. On a
#     push to "stage" they go to GitHub Container Registry (GHCR) under two
#     names for the same digest — the mutable :stage pointer the environment
#     follows and an immutable :sha-<commit>. Services with no change in the
#     commit are not rebuilt: their existing :stage digest is tagged with the
#     commit, so every stage commit has a complete six-service set to promote.
#     A pull request builds but never pushes, so it cannot move :stage.
#     Also performs pre/post-build Docker runner pruning hygiene.
#   • Image digests: Collects the digest of each service into the
#     "image-digests" artifact — the provenance record prod.yml promotes
#     against and a rollback reads.
#   • Deploy: Triggers Coolify stage deployment, polls state until completion,
#     and outputs step summaries or issues cancellations.
#
# Deployment is opt-in:
#   The Coolify deploy job only runs when the repository (or "stage"
#   environment) variable COOLIFY_DEPLOY_ENABLED is set to the string "true".
#   Leave it unset and the whole workflow still runs — lint, build and push to
#   GHCR — while the deploy job is skipped instead of failing on absent
#   credentials. The deploy code below is kept intact so turning the variable
#   on is the only step needed to resume deploying.
#
# What you need in GitHub Secrets (only when COOLIFY_DEPLOY_ENABLED is "true"):
#   • COOLIFY_DEPLOY_URL - Full stage deploy URL with uuid parameter.
#   • COOLIFY_API_TOKEN  - Authorization bearer token for your Coolify API.
#
# Environment Configuration:
#   • Targets the GitHub Environment named "stage" to resolve secrets.
#
# =============================================================================

name: Staging CI/CD

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default: every job that writes something declares the single
# scope it needs, so a compromised action in one job cannot reach the others.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      space: ${{ steps.filter.outputs.space }}
      api: ${{ steps.filter.outputs.api }}
      live: ${{ steps.filter.outputs.live }}
      proxy: ${{ steps.filter.outputs.proxy }}
      code_changes: ${{ steps.filter.outputs.code_changes }}
      any_changed: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            space:
              - 'apps/space/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/stage.yml'
            live:
              - 'apps/live/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            config:
              - 'docker-compose-orca.yml'
              - '.github/workflows/stage.yml'
            proxy:
              - 'apps/proxy/**'
              - '.github/workflows/stage.yml'
            code_changes:
              - 'apps/web/**'
              - 'apps/admin/**'
              - 'apps/space/**'
              - 'apps/live/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  # ---------------------------------------------------------------------------
  # Deploy provenance: the Compose file must pull the images this workflow
  # publishes. `build-push` tags ghcr.io/<this repository>/<service>; if
  # docker-compose-orca.yml defaults to another namespace, staging runs someone
  # else's build of the code that was reviewed here. Cheap, runs on every
  # event, and gates build-push so the drift is caught before an image ships.
  # ---------------------------------------------------------------------------
  compose_provenance:
    name: Compose image namespace matches this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Compare the Compose default namespace with the publishing namespace
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected="${REGISTRY}/$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          compose="docker-compose-orca.yml"

          # Every image built by this workflow has to be pulled through the single
          # ORCA_IMAGE_REPOSITORY variable; a hard-coded registry path would bypass
          # the check, so it is refused outright.
          if grep -nE '^\s*image:\s*ghcr\.io/' "$compose"; then
            echo "::error file=$compose::images must be pulled via \${ORCA_IMAGE_REPOSITORY:-<namespace>}, not a hard-coded ghcr.io path"
            exit 1
          fi

          defaults=$(grep -oE '\$\{ORCA_IMAGE_REPOSITORY:-[^}]+\}' "$compose" | sed -E 's/^\$\{ORCA_IMAGE_REPOSITORY:-(.*)\}$/\1/' | sort -u)
          count=$(printf '%s\n' "$defaults" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error file=$compose::expected exactly one ORCA_IMAGE_REPOSITORY default, found ${count}: ${defaults}"
            exit 1
          fi

          if [ "$defaults" != "$expected" ]; then
            echo "::error file=$compose::ORCA_IMAGE_REPOSITORY defaults to '${defaults}' but this workflow publishes to '${expected}'"
            exit 1
          fi

          for service in web api space admin live proxy; do
            if ! grep -qE "^\s*image:\s*\\$\{ORCA_IMAGE_REPOSITORY:-[^}]+\}/${service}:" "$compose"; then
              echo "::error file=$compose::service image '${service}' is not pulled from ORCA_IMAGE_REPOSITORY"
              exit 1
            fi
          done
          echo "docker-compose-orca.yml pulls from ${expected}, the namespace this workflow publishes to."

  # ---------------------------------------------------------------------------
  # PR Labeler & Template Manager (Pull Requests ONLY)
  # ---------------------------------------------------------------------------
  labeler:
    name: Auto Label & Template PR
    if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'release-please--') && github.event.pull_request.head.ref != 'stage' && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Base Branch Code
        uses: actions/checkout@v7

      - name: Update PR Properties
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/labels" \
            -d '{"name":"stage-pr","color":"bfd4f2","description":"Staging Pull Request"}' || true

          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -d '{"labels":["stage-pr"]}' || true

          CURRENT_BODY=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | python3 -c "import sys, json; print(json.load(sys.stdin).get('body','') or '')" 2>/dev/null || true)

          if [ -z "$(echo "$CURRENT_BODY" | tr -d '[:space:]')" ] || echo "$CURRENT_BODY" | grep -q "READ THIS BEFORE CREATING YOUR PULL REQUEST"; then
            if [ -f .github/PULL_REQUEST_TEMPLATE/basic.md ]; then
              PR_BODY=$(cat .github/PULL_REQUEST_TEMPLATE/basic.md)
              export PR_BODY PR_NUMBER GH_TOKEN GITHUB_API_URL GITHUB_REPOSITORY
              python3 << 'PY'
          import os, json, urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}"
          token = os.environ['GH_TOKEN']
          body = os.environ['PR_BODY']

          payload = json.dumps({'body': body}).encode('utf-8')
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}

          req = urllib.request.Request(url, data=payload, headers=headers, method='PATCH')
          try:
              with urllib.request.urlopen(req) as resp:
                  pass
          except Exception:
              pass
          PY
            fi
          fi

  ci:
    name: Code Quality Checks (CI)
    needs: changes
    if: ${{ needs.changes.outputs.code_changes == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        # Should be --frozen-lockfile (P0.5): a lockfile the CI is allowed to
        # rewrite proves nothing, since the build silently resolves versions
        # no one reviewed. It cannot be flipped yet — pnpm-lock.yaml is out of
        # date with the workspace catalog (11 packages moved to `catalog:` in
        # the package.json files by upstream 31853ab2 while the lockfile kept
        # the resolved specifier), so --frozen-lockfile fails on every run
        # today. Flip it in the same commit that regenerates the lockfile:
        # `pnpm install --lockfile-only`. See
        # docs/plans/orca-work-management/P0-platform-hardening.md, P0.5.
        run: pnpm install --no-frozen-lockfile

      - name: Run Format and Lint Checks
        run: |
          pnpm check:format
          pnpm check:lint

      # The i18n catalogue is only as good as its weakest locale: a key added to
      # en/ and forgotten everywhere else renders the raw key string to whoever
      # runs that language. sync-check compares every locale against English and
      # also catches cross-namespace collisions and path conflicts, neither of
      # which surfaces at runtime until the wrong string appears on screen.
      # Cheap (reads JSON, no build), so it runs before the type checks.
      - name: Run i18n Catalogue Sync Check
        run: pnpm check:sync

      # Turbo builds the workspace packages first (check:types dependsOn ^build),
      # so this catches type errors the format and lint passes cannot see.
      - name: Run Type Checks
        run: pnpm check:types

  # ---------------------------------------------------------------------------
  # Backend tests. The Orca organizational layer materializes native
  # ProjectMember rows, so its tests assert against real rows in a real
  # PostgreSQL database — partial unique indexes and soft-delete behavior do not
  # reproduce on SQLite or against mocks.
  # ---------------------------------------------------------------------------
  api_tests:
    name: API Tests (pytest)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plane -d plane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # plane/__init__.py imports plane.celery, which calls redis_instance() at
      # module scope — so importing anything from plane needs REDIS_URL to be a
      # parseable URL before a single test is collected. Valkey, matching
      # docker-compose-test.yml.
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://plane:plane@localhost:5432/plane_test
      REDIS_URL: redis://localhost:6379/
      SECRET_KEY: stage-ci-secret-key-not-used-outside-tests
      DJANGO_SETTINGS_MODULE: plane.settings.test
      # Project creation reads these; without them the serializer raises and
      # every test that creates a project fails with an opaque 500.
      APP_BASE_URL: http://localhost:3000
      WEB_URL: http://localhost:3000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      # Scoped to the Orca suite: it is the fork's own surface and is verified
      # green against this configuration. The upstream contract and smoke
      # suites reach for services this job does not stand up (object storage
      # among them), so widening the path is a separate change that has to
      # provision them first — not something to switch on untested here, where
      # a pre-existing failure would block every build.
      - name: Run Orca Tests
        working-directory: ./apps/api
        run: pytest plane/tests/unit/orca/ -q

  # ---------------------------------------------------------------------------
  # Python lint and format. The frontend has had oxlint and oxfmt gating merges
  # since the beginning; the API had ruff configured in pyproject.toml and no
  # workflow running it, so the configuration was decorative.
  # ---------------------------------------------------------------------------
  api_lint:
    name: API Lint (ruff)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # Read the version from the requirements file instead of repeating it
      # here: ruff's output changes between releases, so a CI running a
      # different version than the developers would fail on code that is clean
      # locally, or pass code that is not.
      - name: Install Ruff
        working-directory: ./apps/api
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ruff==\([0-9][0-9.]*\).*/\1/p' requirements/local.txt | head -1)
          if [ -z "${version}" ]; then
            echo "::error file=apps/api/requirements/local.txt::no pinned ruff version found"
            exit 1
          fi
          echo "Installing ruff==${version}"
          python -m pip install --upgrade pip
          pip install "ruff==${version}"

      - name: Run Ruff Lint
        working-directory: ./apps/api
        run: ruff check .

      # A temporary exclude list in pyproject.toml holds the upstream files the
      # fork has never touched; see the comment there and P0.11.
      - name: Run Ruff Format Check
        working-directory: ./apps/api
        run: ruff format --check .

  build-push:
    name: Build & Push ${{ matrix.service }}
    needs: [ci, api_tests, api_lint, changes, compose_provenance]
    # `ci` and `api_tests` are each scoped to the paths they cover, so either
    # may legitimately be skipped — a web-only change skips api_tests, and a
    # config-only change skips ci. A skipped dependency would normally skip
    # this job too, which would stop the build for exactly those changes, so
    # the gate is on `failure` rather than on completion.
    # A push to stage always runs, even when no service path changed: the
    # commit still needs its :sha-<commit> tags (the retag path below), or
    # promotion by SHA would fail on, say, a docs-only commit that happens to
    # be the head of a release candidate.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && (needs.changes.outputs.any_changed == 'true'
              || github.event_name == 'workflow_dispatch'
              || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            file: ./apps/web/Dockerfile.web
          - service: api
            context: ./apps/api
            file: ./apps/api/Dockerfile.api
          - service: space
            context: .
            file: ./apps/space/Dockerfile.space
          - service: admin
            context: .
            file: ./apps/admin/Dockerfile.admin
          - service: live
            context: .
            file: ./apps/live/Dockerfile.live
          - service: proxy
            context: ./apps/proxy
            file: ./apps/proxy/Dockerfile.ce
    steps:
      # -----------------------------------------------------------------------
      # Three outcomes per service, decided once so every step below reads the
      # same answer:
      #   build — the service changed (or the run was dispatched by hand);
      #   retag — nothing in this service changed, but the commit still needs
      #           an immutable sha- tag pointing at the image staging runs, or
      #           promotion by SHA (prod.yml) would find a hole in the set;
      #   skip  — nothing to do (unchanged service on a pull request).
      # -----------------------------------------------------------------------
      - name: Plan Work For ${{ matrix.service }}
        id: plan
        env:
          SERVICE_CHANGED: ${{ needs.changes.outputs[matrix.service] }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${SERVICE_CHANGED}" = "true" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            mode=build
          elif [ "${EVENT_NAME}" = "push" ]; then
            mode=retag
          else
            mode=skip
          fi
          echo "Mode for ${{ matrix.service }}: ${mode}"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        if: ${{ steps.plan.outputs.mode == 'build' }}
        uses: actions/checkout@v7

      - name: Lowercase Image Name
        if: ${{ steps.plan.outputs.mode != 'skip' }}
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # A pull request must never be able to move the mutable :stage tag — that
      # tag is what the staging environment pulls, so an unreviewed branch could
      # otherwise publish over the reviewed build. Pull requests still build the
      # image (that is the signal: it compiles) and then throw it away, so they
      # do not need registry credentials at all.
      - name: Log in to GHCR
        if: ${{ steps.plan.outputs.mode == 'retag' || (steps.plan.outputs.mode == 'build' && github.event_name != 'pull_request') }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ steps.plan.outputs.mode == 'build' }}
        uses: docker/setup-buildx-action@v4

      - name: Pre-build Runner Hygiene Cleanup
        if: ${{ steps.plan.outputs.mode == 'build' }}
        run: |
          echo "Running pre-build Docker cleanup..."
          docker container prune -f
          docker image prune -a -f --filter "until=24h"
          docker builder prune -a -f --filter "until=24h"

      # On a push to stage the image gets two names for the same digest: the
      # mutable :stage pointer the environment follows, and an immutable
      # :sha-<commit> that ties the artifact to the reviewed commit. On a pull
      # request the tag is inert (nothing is pushed) and only names the head.
      - name: Resolve Image Tags
        if: ${{ steps.plan.outputs.mode == 'build' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}/${SERVICE}"
          {
            echo "IMAGE_TAGS<<ORCA_EOF"
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              echo "${image}:pr-${PR_NUMBER}-${GITHUB_SHA}"
            else
              echo "${image}:stage"
              echo "${image}:sha-${GITHUB_SHA}"
            fi
            echo "ORCA_EOF"
          } >> "$GITHUB_ENV"

      - name: Build and Push ${{ matrix.service }}
        id: build
        if: ${{ steps.plan.outputs.mode == 'build' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No rebuild: point :sha-<commit> at the digest already behind :stage, so
      # every commit on stage has a complete, immutable six-service set for
      # prod.yml to promote. imagetools copies the manifest by digest — no pull,
      # no re-push of layers, and multi-arch manifests survive intact.
      - name: Tag Existing ${{ matrix.service }} Image With This Commit
        id: retag
        if: ${{ steps.plan.outputs.mode == 'retag' }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}/${SERVICE}"
          if ! docker buildx imagetools inspect "${image}:stage" > /dev/null 2>&1; then
            echo "::warning::${image}:stage does not exist yet; ${SERVICE} has no image for commit ${GITHUB_SHA}"
            exit 0
          fi
          docker buildx imagetools create --tag "${image}:sha-${GITHUB_SHA}" "${image}:stage"
          digest=$(docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # One file per service; the collect job merges them into the run's
      # image-digests artifact. This is the record of what the commit produced.
      - name: Record ${{ matrix.service }} Image Digest
        if: ${{ steps.plan.outputs.mode != 'skip' && github.event_name != 'pull_request' }}
        env:
          SERVICE: ${{ matrix.service }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          RETAG_DIGEST: ${{ steps.retag.outputs.digest }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          set -euo pipefail
          digest="${BUILD_DIGEST:-${RETAG_DIGEST:-}}"
          if [ -z "${digest}" ]; then
            echo "::warning::no digest recorded for ${SERVICE}"
            exit 0
          fi
          mkdir -p digests
          python3 - <<'PY'
          import json, os

          service = os.environ["SERVICE"]
          record = {
              "image": f"{os.environ['REGISTRY']}/{os.environ['IMAGE_NAME']}/{service}",
              "digest": os.environ.get("BUILD_DIGEST") or os.environ["RETAG_DIGEST"],
              "tag": f"sha-{os.environ['GITHUB_SHA']}",
              "origin": os.environ["MODE"],
          }
          with open(f"digests/{service}.json", "w", encoding="utf-8") as handle:
              json.dump({service: record}, handle, indent=2, sort_keys=True)
          PY
          cat "digests/${SERVICE}.json"

      - name: Upload ${{ matrix.service }} Digest
        if: ${{ steps.plan.outputs.mode != 'skip' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.json
          if-no-files-found: warn
          retention-days: 90

      - name: Post-build Runner Hygiene Cleanup
        if: ${{ always() && steps.plan.outputs.mode == 'build' }}
        run: |
          echo "Running post-build Docker cleanup..."
          docker container prune -f
          docker image prune -f
          docker builder prune -f

  # ---------------------------------------------------------------------------
  # Provenance record for the commit: which digest each of the six services
  # resolves to under :sha-<commit>. prod.yml promotes those digests, so this
  # artifact is what a release is checked against — and what a rollback reads
  # to find the previous set.
  # ---------------------------------------------------------------------------
  image_digests:
    name: Collect Image Digests
    needs: [build-push, changes]
    if: >-
      ${{ !cancelled()
          && github.event_name != 'pull_request'
          && !contains(needs.*.result, 'failure')
          && (needs.changes.outputs.any_changed == 'true'
              || github.event_name == 'workflow_dispatch'
              || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.merge.outputs.digests }}
    steps:
      - name: Download Per-service Digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true

      - name: Merge Digests
        id: merge
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib

          merged = {}
          for path in sorted(pathlib.Path("digests").glob("*.json")):
              merged.update(json.loads(path.read_text(encoding="utf-8")))

          pathlib.Path("image-digests.json").write_text(
              json.dumps(merged, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          missing = [s for s in ("web", "admin", "api", "space", "live", "proxy") if s not in merged]
          if missing:
              print(f"::warning::no digest for: {', '.join(missing)}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("digests=" + json.dumps(merged, sort_keys=True) + "\n")

          lines = ["## Image digests", "", "| Service | Digest | Built |", "|---|---|---|"]
          for service, record in sorted(merged.items()):
              lines.append(f"| `{service}` | `{record['digest']}` | {record['origin']} |")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          PY
          cat image-digests.json

      - name: Upload Image Digests
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy to Stage (Coolify)
    needs: [build-push, changes, image_digests]
    if: ${{ always() && vars.COOLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') && (needs.changes.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch') && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
    steps:
      # Coolify pulls :stage, a mutable tag, so the run log is the only place
      # that says which digests this deploy actually put in staging.
      - name: Log the digests this deploy pulls
        env:
          DIGESTS: ${{ needs.image_digests.outputs.digests }}
        run: |
          set -euo pipefail
          if [ -z "${DIGESTS:-}" ]; then
            echo "::warning::no digest record for this run"
            exit 0
          fi
          python3 - <<'PY'
          import json, os

          for service, record in sorted(json.loads(os.environ["DIGESTS"]).items()):
              print(f"{service}: {record['image']}:{record['tag']} -> {record['digest']}")
          PY

      - name: Trigger Coolify deploy
        id: deploy
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          if [ -z "$deploy_url" ]; then
            echo "::error::COOLIFY_DEPLOY_URL is empty."
            exit 1
          fi
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          uuid="${deploy_url#*uuid=}"
          uuid="${uuid%%&*}"
          success=0
          for i in 1 2 3; do
            if resp=$(curl -f -sS --max-time 30 -X POST "${base}/deploy" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\": \"${uuid}\"}"); then
              success=1
              echo "$resp" > deploy_response.json
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Wait for deployment
        id: wait
        if: success()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then
            echo "::error::Could not read deployment UUID."
            exit 1
          fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          token="${{ secrets.COOLIFY_API_TOKEN }}"
          timeout_sec=900
          interval=20
          elapsed=0
          while [ $elapsed -lt $timeout_sec ]; do
            curl -sS --max-time 30 -X GET "${base}/deployments/${dep_uuid}" \
              -H "Authorization: Bearer ${token}" -o deployment.json 2>/dev/null || true
            status=$(python3 -c "
          import json
          try:
              print(json.load(open('deployment.json')).get('status','').lower())
          except Exception:
              print('')
          " 2>/dev/null || true)
            case "$status" in
              finished|success) break ;;
              failed|cancelled|cancelled-by-user) echo "Coolify deployment failed or was cancelled: $status"; exit 1 ;;
              *) ;;
            esac
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $elapsed -ge $timeout_sec ]; then
            echo "Deployment did not finish within ${timeout_sec}s"
            exit 1
          fi
          echo "elapsed_sec=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        if: success() && steps.wait.outcome == 'success'
        env:
          ELAPSED_SEC: ${{ steps.wait.outputs.elapsed_sec }}
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          dashboard="${base%/api/v1}"
          [ "$dashboard" = "$base" ] && dashboard="${base%/api}"
          export DASHBOARD="$dashboard"
          export GITHUB_SERVER_URL="${{ github.server_url }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          export ELAPSED_SEC="${ELAPSED_SEC:-0}"
          python3 << 'PY'
          import json, os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          dashboard = (os.environ.get('DASHBOARD') or '').rstrip('/')
          gh_server = os.environ.get('GITHUB_SERVER_URL', '')
          gh_repo = os.environ.get('GITHUB_REPOSITORY', '')
          gh_sha = os.environ.get('GITHUB_SHA', '')
          branch = os.environ.get('GITHUB_REF_NAME', '—')
          try:
              elapsed_sec = int(os.environ.get('ELAPSED_SEC', 0))
          except Exception:
              elapsed_sec = 0
          def format_duration(s):
              if s < 60:
                  return f'{s}s'
              m, s = divmod(s, 60)
              return f'{m}m {s}s' if s else f'{m}m'
          deploy_duration = format_duration(elapsed_sec) if elapsed_sec else '—'
          try:
              with open('deployment.json') as f:
                  d = json.load(f)
          except Exception:
              d = {}
          app = d.get('application_name', 'N/A')
          status = (d.get('status') or 'N/A').lower()
          status_display = '✅ ' + status if status in ('finished', 'success') else status
          coolify_path = (d.get('deployment_url') or '').strip()
          if coolify_path and dashboard and not (coolify_path.startswith('http://') or coolify_path.startswith('https://')):
              full_coolify_url = dashboard + coolify_path if coolify_path.startswith('/') else coolify_path
          else:
              full_coolify_url = dashboard if dashboard else ''
          coolify_url_cell = f'[Link]({full_coolify_url})' if full_coolify_url else '—'
          commit = d.get('commit') or d.get('commit_message') or gh_sha or '—'
          commit_sha = (d.get('commit') or gh_sha or '').strip()
          if commit_sha and gh_server and gh_repo:
              short_sha = commit_sha[:7] if len(commit_sha) >= 7 else commit_sha
              commit_cell = f'[{short_sha}]({gh_server}/{gh_repo}/commit/{commit_sha})'
          else:
              commit_cell = commit
          lines = [
              '## Coolify deployment',
              '',
              '| Property | Value |',
              '|---|-----|',
              f'| **Application** | {app} |',
              f'| **Status** | {status_display} |',
              f'| **Branch** | {branch} |',
              f'| **Deploy duration** | {deploy_duration} |',
              f'| **Commit** | {commit_cell} |',
              f'| **Coolify URL** | {coolify_url_cell} |',
              '',
          ]
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write('\n'.join(lines) + '\n')
          PY

      - name: Cancel Coolify deployment (if job cancelled)
        if: cancelled()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then exit 0; fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          curl -sS --max-time 15 -X POST "${base}/deployments/${dep_uuid}/cancel" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" || true

      - name: Deployment failed summary
        if: failure()
        run: |
          branch="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          repo="${{ github.repository }}"
          server="${{ github.server_url }}"
          commit_link="[${short_sha}](${server}/${repo}/commit/${sha})"
          {
            echo '## Deployment failed'
            echo ''
            echo 'Deployment failed, was cancelled, or timed out.'
            echo ''
            echo '| | |'
            echo '|---|-----|'
            echo "| **Branch** | ${branch} |"
            echo "| **Commit** | ${commit_link} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Maintain Release Candidate PR (Pushes ONLY — Runs in Parallel)
  # ---------------------------------------------------------------------------
  promote-rc:
    name: Ensure Release Candidate PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Opens a pull request; it never pushes a commit, so contents stays read.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: stage
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Skip if post-release sync commit
        id: sync-guard
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s HEAD)
          echo "Latest commit: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -qE "\[skip ci\]|^orca-chore: sync prod"; then
            echo "Post-release sync commit detected — skipping RC PR maintenance."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # This job is the only thing that says "stage is ahead of prod and there
      # is a release candidate open for it". Every failure mode here has to be
      # loud: a green run with no PR is worse than a red one, because nobody
      # goes looking for a release that CI claims to have prepared.
      #
      # `gh pr create` returns 403 when the repository has "Allow GitHub
      # Actions to create and approve pull requests" turned off (Settings →
      # Actions → General) and the run is using the default GITHUB_TOKEN. The
      # job fails in that case, by design: set RELEASE_PLEASE_TOKEN or turn the
      # setting on.
      # ---------------------------------------------------------------------
      - name: Maintain Release Candidate PR
        if: steps.sync-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ASSIGNEE_VAR: ${{ vars.RELEASE_ASSIGNEE }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          TARGET_ASSIGNEE="${RELEASE_ASSIGNEE_VAR:-$ACTOR}"

          # prod may legitimately not exist yet on a fresh repository, so the
          # fetch is allowed to fail — but then there is nothing to compare
          # against and the job says so instead of reporting success.
          git fetch --no-tags origin prod || true
          if ! git rev-parse --verify --quiet refs/remotes/origin/prod > /dev/null; then
            echo "::error::branch 'prod' does not exist; cannot maintain a release candidate PR"
            exit 1
          fi

          COMMITS_AHEAD=$(git rev-list --count refs/remotes/origin/prod..stage)
          echo "Commits on stage ahead of prod: $COMMITS_AHEAD"

          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "Stage branch is completely synced with prod. No Release Candidate PR needed."
            exit 0
          fi

          VERSION=$(python3 -c "import json; print(json.load(open('package.json')).get('version', ''))")
          echo "Current package version: ${VERSION:-<none>}"
          if [ -n "$VERSION" ]; then
            PR_TITLE="release: Promote Release Candidate from v${VERSION}"
          else
            PR_TITLE="release: Promote Release Candidate"
          fi

          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head stage --base prod \
            --state open --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "Existing open Release Candidate PR found (#${PR_NUMBER})."
          else
            echo "No open Release Candidate PR found. Creating one from stage to prod..."
            if [ -f .github/PULL_REQUEST_TEMPLATE/release_candidate.md ]; then
              BODY_FILE=.github/PULL_REQUEST_TEMPLATE/release_candidate.md
            else
              BODY_FILE=$(mktemp)
              echo "Promote Release Candidate changes from stage to prod." > "$BODY_FILE"
            fi
            CREATED_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --head stage --base prod \
              --title "$PR_TITLE" --body-file "$BODY_FILE")
            echo "$CREATED_URL"
            # gh prints the PR URL; fall back to a list in case the output
            # format ever changes, rather than failing a job that did create
            # the PR it was asked to create.
            PR_NUMBER="${CREATED_URL##*/}"
            case "$PR_NUMBER" in
              ''|*[!0-9]*)
                PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head stage --base prod \
                  --state open --json number --jq '.[0].number // empty')
                ;;
            esac
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::RC PR not found nor created"
            exit 1
          fi

          # An unassignable user (a stale RELEASE_ASSIGNEE, an actor without
          # repository access) is a nuisance, not a release blocker: the PR
          # exists, which is what this job is accountable for.
          if [ -n "$TARGET_ASSIGNEE" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee "$TARGET_ASSIGNEE" \
              || echo "::warning::could not assign ${TARGET_ASSIGNEE} to PR #${PR_NUMBER}"
          fi

          PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          echo "Release candidate: ${PR_URL}"
          {
            echo "## Release candidate"
            echo ""
            echo "[#${PR_NUMBER}](${PR_URL}) — ${COMMITS_AHEAD} commit(s) ahead of prod."
          } >> "$GITHUB_STEP_SUMMARY"
