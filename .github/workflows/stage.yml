# =============================================================================
# Stage: Test, Build & Deploy (Plane Orca Stage)
# =============================================================================
#
# When: You push to the "stage" branch or open a pull request targeting "stage".
# Where: Runs on GitHub Actions runners (ubuntu-latest).
#
# What happens:
#   • CI check: Runs oxfmt and oxlint checks to enforce code standards.
#   • Build & Push: Builds the web, api, space, live, and proxy images, and
#     pushes them to GitHub Container Registry (GHCR) tagged as :stage.
#     Also performs pre/post-build Docker runner pruning hygiene.
#     On a pull request the images are built but never pushed: :stage is the
#     tag the staging environment pulls, so only a merge may write it.
#   • Deploy: Triggers Coolify stage deployment, polls state until completion,
#     and outputs step summaries or issues cancellations.
#
# Deployment is opt-in:
#   The Coolify deploy job only runs when the repository (or "stage"
#   environment) variable COOLIFY_DEPLOY_ENABLED is set to the string "true".
#   Leave it unset and the whole workflow still runs — lint, build and push to
#   GHCR — while the deploy job is skipped instead of failing on absent
#   credentials. The deploy code below is kept intact so turning the variable
#   on is the only step needed to resume deploying.
#
# What you need in GitHub Secrets (only when COOLIFY_DEPLOY_ENABLED is "true"):
#   • COOLIFY_DEPLOY_URL - Full stage deploy URL with uuid parameter.
#   • COOLIFY_API_TOKEN  - Authorization bearer token for your Coolify API.
#
# Environment Configuration:
#   • Targets the GitHub Environment named "stage" to resolve secrets.
#
# =============================================================================

name: Staging CI/CD

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; every job that writes something declares the one
# permission it needs. A compromised action in any other job then holds a token
# that cannot label, comment, push or publish.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      space: ${{ steps.filter.outputs.space }}
      api: ${{ steps.filter.outputs.api }}
      live: ${{ steps.filter.outputs.live }}
      proxy: ${{ steps.filter.outputs.proxy }}
      code_changes: ${{ steps.filter.outputs.code_changes }}
      any_changed: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            space:
              - 'apps/space/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/stage.yml'
            live:
              - 'apps/live/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/stage.yml'
            config:
              - 'docker-compose-orca.yml'
              - '.github/workflows/stage.yml'
            proxy:
              - 'apps/proxy/**'
              - '.github/workflows/stage.yml'
            code_changes:
              - 'apps/web/**'
              - 'apps/admin/**'
              - 'apps/space/**'
              - 'apps/live/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  # ---------------------------------------------------------------------------
  # Deploy provenance: the Compose file must pull the images this workflow
  # publishes. `build-push` tags ghcr.io/<this repository>/<service>; if
  # docker-compose-orca.yml defaults to another namespace, staging runs someone
  # else's build of the code that was reviewed here. Cheap, runs on every
  # event, and gates build-push so the drift is caught before an image ships.
  # ---------------------------------------------------------------------------
  compose_provenance:
    name: Compose image namespace matches this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Compare the Compose default namespace with the publishing namespace
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected="${REGISTRY}/$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          compose="docker-compose-orca.yml"

          # Every image built by this workflow has to be pulled through the single
          # ORCA_IMAGE_REPOSITORY variable; a hard-coded registry path would bypass
          # the check, so it is refused outright.
          if grep -nE '^\s*image:\s*ghcr\.io/' "$compose"; then
            echo "::error file=$compose::images must be pulled via \${ORCA_IMAGE_REPOSITORY:-<namespace>}, not a hard-coded ghcr.io path"
            exit 1
          fi

          defaults=$(grep -oE '\$\{ORCA_IMAGE_REPOSITORY:-[^}]+\}' "$compose" | sed -E 's/^\$\{ORCA_IMAGE_REPOSITORY:-(.*)\}$/\1/' | sort -u)
          count=$(printf '%s\n' "$defaults" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error file=$compose::expected exactly one ORCA_IMAGE_REPOSITORY default, found ${count}: ${defaults}"
            exit 1
          fi

          if [ "$defaults" != "$expected" ]; then
            echo "::error file=$compose::ORCA_IMAGE_REPOSITORY defaults to '${defaults}' but this workflow publishes to '${expected}'"
            exit 1
          fi

          for service in web api space admin live proxy; do
            if ! grep -qE "^\s*image:\s*\\$\{ORCA_IMAGE_REPOSITORY:-[^}]+\}/${service}:" "$compose"; then
              echo "::error file=$compose::service image '${service}' is not pulled from ORCA_IMAGE_REPOSITORY"
              exit 1
            fi
          done
          echo "docker-compose-orca.yml pulls from ${expected}, the namespace this workflow publishes to."

  # ---------------------------------------------------------------------------
  # PR Labeler & Template Manager (Pull Requests ONLY)
  # ---------------------------------------------------------------------------
  labeler:
    name: Auto Label & Template PR
    if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'release-please--') && github.event.pull_request.head.ref != 'stage' && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Base Branch Code
        uses: actions/checkout@v7

      - name: Update PR Properties
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/labels" \
            -d '{"name":"stage-pr","color":"bfd4f2","description":"Staging Pull Request"}' || true

          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -d '{"labels":["stage-pr"]}' || true

          CURRENT_BODY=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | python3 -c "import sys, json; print(json.load(sys.stdin).get('body','') or '')" 2>/dev/null || true)

          if [ -z "$(echo "$CURRENT_BODY" | tr -d '[:space:]')" ] || echo "$CURRENT_BODY" | grep -q "READ THIS BEFORE CREATING YOUR PULL REQUEST"; then
            if [ -f .github/PULL_REQUEST_TEMPLATE/basic.md ]; then
              PR_BODY=$(cat .github/PULL_REQUEST_TEMPLATE/basic.md)
              export PR_BODY PR_NUMBER GH_TOKEN GITHUB_API_URL GITHUB_REPOSITORY
              python3 << 'PY'
          import os, json, urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}"
          token = os.environ['GH_TOKEN']
          body = os.environ['PR_BODY']

          payload = json.dumps({'body': body}).encode('utf-8')
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}

          req = urllib.request.Request(url, data=payload, headers=headers, method='PATCH')
          try:
              with urllib.request.urlopen(req) as resp:
                  pass
          except Exception:
              pass
          PY
            fi
          fi

  ci:
    name: Code Quality Checks (CI)
    needs: changes
    if: ${{ needs.changes.outputs.code_changes == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      # Frozen: CI installs exactly what pnpm-lock.yaml pins. Without it a
      # dependency bump that never made it into the lockfile is resolved fresh
      # here, so CI tests a tree nobody else has.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Format and Lint Checks
        run: |
          pnpm check:format
          pnpm check:lint

      # The i18n catalogue is only as good as its weakest locale: a key added to
      # en/ and forgotten everywhere else renders the raw key string to whoever
      # runs that language. sync-check compares every locale against English and
      # also catches cross-namespace collisions and path conflicts, neither of
      # which surfaces at runtime until the wrong string appears on screen.
      # Cheap (reads JSON, no build), so it runs before the type checks.
      - name: Run i18n Catalogue Sync Check
        run: pnpm check:sync

      # Turbo builds the workspace packages first (check:types dependsOn ^build),
      # so this catches type errors the format and lint passes cannot see.
      - name: Run Type Checks
        run: pnpm check:types

  # ---------------------------------------------------------------------------
  # Backend tests. The Orca organizational layer materializes native
  # ProjectMember rows, so its tests assert against real rows in a real
  # PostgreSQL database — partial unique indexes and soft-delete behavior do not
  # reproduce on SQLite or against mocks.
  # ---------------------------------------------------------------------------
  api_tests:
    name: API Tests (pytest)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plane -d plane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # plane/__init__.py imports plane.celery, which calls redis_instance() at
      # module scope — so importing anything from plane needs REDIS_URL to be a
      # parseable URL before a single test is collected. Valkey, matching
      # docker-compose-test.yml.
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://plane:plane@localhost:5432/plane_test
      REDIS_URL: redis://localhost:6379/
      SECRET_KEY: stage-ci-secret-key-not-used-outside-tests
      DJANGO_SETTINGS_MODULE: plane.settings.test
      # Project creation reads these; without them the serializer raises and
      # every test that creates a project fails with an opaque 500.
      APP_BASE_URL: http://localhost:3000
      WEB_URL: http://localhost:3000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      # Scoped to the Orca suite: it is the fork's own surface and is verified
      # green against this configuration. The upstream contract and smoke
      # suites reach for services this job does not stand up (object storage
      # among them), so widening the path is a separate change that has to
      # provision them first — not something to switch on untested here, where
      # a pre-existing failure would block every build.
      - name: Run Orca Tests
        working-directory: ./apps/api
        run: pytest plane/tests/unit/orca/ -q

  build-push:
    name: Build & Push ${{ matrix.service }}
    needs: [ci, api_tests, changes, compose_provenance]
    # `ci` and `api_tests` are each scoped to the paths they cover, so either
    # may legitimately be skipped — a web-only change skips api_tests, and a
    # config-only change skips ci. A skipped dependency would normally skip
    # this job too, which would stop the build for exactly those changes, so
    # the gate is on `failure` rather than on completion.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && (needs.changes.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            file: ./apps/web/Dockerfile.web
          - service: api
            context: ./apps/api
            file: ./apps/api/Dockerfile.api
          - service: space
            context: .
            file: ./apps/space/Dockerfile.space
          - service: admin
            context: .
            file: ./apps/admin/Dockerfile.admin
          - service: live
            context: .
            file: ./apps/live/Dockerfile.live
          - service: proxy
            context: ./apps/proxy
            file: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout Code
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7

      - name: Lowercase Image Name
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # A pull request build proves the image compiles; it has no business
      # holding a registry credential, and without one it cannot push.
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' && (needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch') }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/setup-buildx-action@v4

      - name: Pre-build Runner Hygiene Cleanup
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Running pre-build Docker cleanup..."
          docker container prune -f
          docker image prune -a -f --filter "until=24h"
          docker builder prune -a -f --filter "until=24h"

      # `:stage` is what the deployed Compose pulls. A pull request that wrote
      # it would replace the running staging image with unreviewed code, so the
      # tag a PR build carries names the PR and the commit instead, and the
      # push below is off for that event: the build still has to succeed.
      - name: Resolve Image Tags
        id: image_tags
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          SERVICE: ${{ matrix.service }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}/${SERVICE}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            tags="${image}:pr-${PR_NUMBER}-${GITHUB_SHA}"
          else
            # `:stage` is mutable and says "whatever is deployed now";
            # `:sha-<commit>` never moves and is what production promotes.
            tags=$(printf '%s:stage\n%s:sha-%s' "${image}" "${image}" "${GITHUB_SHA}")
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "${tags}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags for ${SERVICE}: ${tags}"

      - name: Build and Push ${{ matrix.service }}
        id: build
        if: ${{ needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.image_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is the only identifier that cannot be moved to point at
      # other bits. Recorded per service here and merged by `image_digests`
      # below, because a matrix job cannot write a shared output.
      - name: Record ${{ matrix.service }} Digest
        if: ${{ github.event_name != 'pull_request' && (needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch') }}
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::build-push-action reported no digest for ${SERVICE}"
            exit 1
          fi
          mkdir -p digests
          printf '{"service":"%s","digest":"%s"}\n' "${SERVICE}" "${DIGEST}" > "digests/${SERVICE}.json"
          cat "digests/${SERVICE}.json"

      - name: Upload ${{ matrix.service }} Digest
        if: ${{ github.event_name != 'pull_request' && (needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Post-build Runner Hygiene Cleanup
        if: ${{ always() && (needs.changes.outputs[matrix.service] == 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          echo "Running post-build Docker cleanup..."
          docker container prune -f
          docker image prune -f
          docker builder prune -f

  # ---------------------------------------------------------------------------
  # One record per commit of exactly which bits staging runs, and the
  # `sha-<commit>` tag that production promotes from.
  #
  # `build-push` only rebuilds the services whose paths changed, so a commit
  # that touches the API alone would leave the other five without a
  # `sha-<commit>` tag — and prod.yml, which promotes by SHA, would find an
  # incomplete set. This job fills those in from the digest `:stage` already
  # points at: not rebuilding a service means this commit ships the image the
  # previous one built, and saying so explicitly is what makes the promotion
  # reproducible.
  # ---------------------------------------------------------------------------
  image_digests:
    name: Collect Image Digests
    needs: [build-push, changes]
    if: >-
      ${{ !cancelled()
          && github.event_name != 'pull_request'
          && !contains(needs.*.result, 'failure')
          && (needs.changes.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digests: ${{ steps.collect.outputs.digests }}
    steps:
      - name: Lowercase Image Name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A run where every service was skipped downloads nothing; that is a
      # legitimate state (config-only commit) and the collect step below
      # resolves all six from the registry, so a missing artifact is not an
      # error here.
      - name: Download Digests From The Build Matrix
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true

      - name: Collect Digests
        id: collect
        env:
          SERVICES: web api space admin live proxy
        run: |
          set -euo pipefail
          mkdir -p digests
          image_base="${REGISTRY}/${IMAGE_NAME}"
          entries=""

          for service in ${SERVICES}; do
            file="digests/${service}.json"
            if [ -f "${file}" ]; then
              digest=$(jq -er '.digest' "${file}")
              rebuilt=true
            else
              # Not rebuilt at this commit: whatever `:stage` points at is what
              # this commit ships for this service.
              digest=$(docker buildx imagetools inspect "${image_base}/${service}:stage" --format '{{.Manifest.Digest}}' 2>/dev/null | tr -d '[:space:]') || digest=""
              if [ -z "${digest}" ]; then
                echo "::error::${image_base}/${service}:stage does not exist, so this commit has no image for ${service}. Run this workflow once via workflow_dispatch to build all six services."
                exit 1
              fi
              rebuilt=false
              # Give it the immutable tag too, so promotion by SHA finds a
              # complete set. Re-tagging by digest copies no layers.
              docker buildx imagetools create --tag "${image_base}/${service}:sha-${GITHUB_SHA}" "${image_base}/${service}@${digest}"
            fi
            entries="${entries}${service}\t${digest}\t${rebuilt}\n"
          done

          printf "%b" "${entries}" | jq -R -s --arg commit "${GITHUB_SHA}" --arg base "${image_base}" --arg run "${GITHUB_RUN_ID}" '
            {
              commit: $commit,
              workflow_run: $run,
              images: (
                split("\n")
                | map(select(length > 0) | split("\t"))
                | map({ key: .[0], value: { image: ($base + "/" + .[0]), digest: .[1], tag: ("sha-" + $commit), rebuilt: (.[2] == "true") } })
                | from_entries
              )
            }' > image-digests.json

          jq -c . image-digests.json
          echo "digests=$(jq -c . image-digests.json)" >> "$GITHUB_OUTPUT"

          {
            echo "## Images published for \`${GITHUB_SHA}\`"
            echo ""
            echo "| Service | Digest | Rebuilt in this run |"
            echo "|---|---|---|"
            jq -r '.images | to_entries[] | "| \(.key) | `\(.value.digest)` | \(if .value.rebuilt then "yes" else "no (inherited from :stage)" end) |"' image-digests.json
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Image Digests
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.json
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: Deploy to Stage (Coolify)
    needs: [build-push, changes, image_digests]
    if: ${{ always() && vars.COOLIFY_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') && (needs.changes.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch') && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
    steps:
      # Coolify pulls `:stage` by tag, so the run log is the only place that
      # ties this deployment to the exact bits. Printed before the deploy is
      # triggered, so it survives a deploy that later fails.
      - name: Log The Digests This Deploy Pulls
        if: ${{ needs.image_digests.result == 'success' }}
        env:
          DIGESTS: ${{ needs.image_digests.outputs.digests }}
        run: |
          set -euo pipefail
          echo "${DIGESTS}" | jq -r '"commit \(.commit)", (.images | to_entries[] | "  \(.key): \(.value.image)@\(.value.digest)")'

      - name: Trigger Coolify deploy
        id: deploy
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          if [ -z "$deploy_url" ]; then
            echo "::error::COOLIFY_DEPLOY_URL is empty."
            exit 1
          fi
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          uuid="${deploy_url#*uuid=}"
          uuid="${uuid%%&*}"
          success=0
          for i in 1 2 3; do
            if resp=$(curl -f -sS --max-time 30 -X POST "${base}/deploy" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\": \"${uuid}\"}"); then
              success=1
              echo "$resp" > deploy_response.json
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Wait for deployment
        id: wait
        if: success()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then
            echo "::error::Could not read deployment UUID."
            exit 1
          fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          token="${{ secrets.COOLIFY_API_TOKEN }}"
          timeout_sec=900
          interval=20
          elapsed=0
          while [ $elapsed -lt $timeout_sec ]; do
            curl -sS --max-time 30 -X GET "${base}/deployments/${dep_uuid}" \
              -H "Authorization: Bearer ${token}" -o deployment.json 2>/dev/null || true
            status=$(python3 -c "
          import json
          try:
              print(json.load(open('deployment.json')).get('status','').lower())
          except Exception:
              print('')
          " 2>/dev/null || true)
            case "$status" in
              finished|success) break ;;
              failed|cancelled|cancelled-by-user) echo "Coolify deployment failed or was cancelled: $status"; exit 1 ;;
              *) ;;
            esac
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $elapsed -ge $timeout_sec ]; then
            echo "Deployment did not finish within ${timeout_sec}s"
            exit 1
          fi
          echo "elapsed_sec=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        if: success() && steps.wait.outcome == 'success'
        env:
          ELAPSED_SEC: ${{ steps.wait.outputs.elapsed_sec }}
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          dashboard="${base%/api/v1}"
          [ "$dashboard" = "$base" ] && dashboard="${base%/api}"
          export DASHBOARD="$dashboard"
          export GITHUB_SERVER_URL="${{ github.server_url }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          export ELAPSED_SEC="${ELAPSED_SEC:-0}"
          python3 << 'PY'
          import json, os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          dashboard = (os.environ.get('DASHBOARD') or '').rstrip('/')
          gh_server = os.environ.get('GITHUB_SERVER_URL', '')
          gh_repo = os.environ.get('GITHUB_REPOSITORY', '')
          gh_sha = os.environ.get('GITHUB_SHA', '')
          branch = os.environ.get('GITHUB_REF_NAME', '—')
          try:
              elapsed_sec = int(os.environ.get('ELAPSED_SEC', 0))
          except Exception:
              elapsed_sec = 0
          def format_duration(s):
              if s < 60:
                  return f'{s}s'
              m, s = divmod(s, 60)
              return f'{m}m {s}s' if s else f'{m}m'
          deploy_duration = format_duration(elapsed_sec) if elapsed_sec else '—'
          try:
              with open('deployment.json') as f:
                  d = json.load(f)
          except Exception:
              d = {}
          app = d.get('application_name', 'N/A')
          status = (d.get('status') or 'N/A').lower()
          status_display = '✅ ' + status if status in ('finished', 'success') else status
          coolify_path = (d.get('deployment_url') or '').strip()
          if coolify_path and dashboard and not (coolify_path.startswith('http://') or coolify_path.startswith('https://')):
              full_coolify_url = dashboard + coolify_path if coolify_path.startswith('/') else coolify_path
          else:
              full_coolify_url = dashboard if dashboard else ''
          coolify_url_cell = f'[Link]({full_coolify_url})' if full_coolify_url else '—'
          commit = d.get('commit') or d.get('commit_message') or gh_sha or '—'
          commit_sha = (d.get('commit') or gh_sha or '').strip()
          if commit_sha and gh_server and gh_repo:
              short_sha = commit_sha[:7] if len(commit_sha) >= 7 else commit_sha
              commit_cell = f'[{short_sha}]({gh_server}/{gh_repo}/commit/{commit_sha})'
          else:
              commit_cell = commit
          lines = [
              '## Coolify deployment',
              '',
              '| Property | Value |',
              '|---|-----|',
              f'| **Application** | {app} |',
              f'| **Status** | {status_display} |',
              f'| **Branch** | {branch} |',
              f'| **Deploy duration** | {deploy_duration} |',
              f'| **Commit** | {commit_cell} |',
              f'| **Coolify URL** | {coolify_url_cell} |',
              '',
          ]
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write('\n'.join(lines) + '\n')
          PY

      - name: Cancel Coolify deployment (if job cancelled)
        if: cancelled()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then exit 0; fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          curl -sS --max-time 15 -X POST "${base}/deployments/${dep_uuid}/cancel" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" || true

      - name: Deployment failed summary
        if: failure()
        run: |
          branch="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          repo="${{ github.repository }}"
          server="${{ github.server_url }}"
          commit_link="[${short_sha}](${server}/${repo}/commit/${sha})"
          {
            echo '## Deployment failed'
            echo ''
            echo 'Deployment failed, was cancelled, or timed out.'
            echo ''
            echo '| | |'
            echo '|---|-----|'
            echo "| **Branch** | ${branch} |"
            echo "| **Commit** | ${commit_link} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Maintain Release Candidate PR (Pushes ONLY — Runs in Parallel)
  # ---------------------------------------------------------------------------
  promote-rc:
    name: Ensure Release Candidate PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: stage
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Skip if post-release sync commit
        id: sync-guard
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s HEAD)
          echo "Latest commit: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -qE "\[skip ci\]|^orca-chore: sync prod"; then
            echo "Post-release sync commit detected — skipping RC PR maintenance."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # This job is the only thing that opens the release candidate PR, so a
      # green run with no PR is the failure mode that matters: the release
      # silently stops happening and nobody is told. Every call therefore
      # either succeeds or fails the job, and the last statement checks that a
      # PR number actually exists.
      #
      # Needs "Allow GitHub Actions to create and approve pull requests"
      # (Settings -> Actions -> General) unless RELEASE_PLEASE_TOKEN is set.
      # ---------------------------------------------------------------------
      - name: Maintain Release Candidate PR
        if: steps.sync-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ASSIGNEE_VAR: ${{ vars.RELEASE_ASSIGNEE }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          TARGET_ASSIGNEE="${RELEASE_ASSIGNEE_VAR:-$ACTOR}"

          git fetch --no-tags origin prod || true
          if ! git rev-parse --verify origin/prod >/dev/null 2>&1; then
            echo "::error::origin/prod does not exist, so there is nothing to open a release candidate against."
            exit 1
          fi

          COMMITS_AHEAD=$(git rev-list --count origin/prod..stage)
          echo "Commits on stage ahead of prod: $COMMITS_AHEAD"
          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "Stage branch is completely synced with prod. No Release Candidate PR needed."
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || true)
          if [ -n "$VERSION" ]; then
            PR_TITLE="release: Promote Release Candidate from v${VERSION}"
          else
            PR_TITLE="release: Promote Release Candidate"
          fi

          PR_NUMBER=$(gh pr list --base prod --head stage --state open --json number --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open Release Candidate PR found. Creating one from stage to prod..."
            if [ -f .github/PULL_REQUEST_TEMPLATE/release_candidate.md ]; then
              BODY_ARGS=(--body-file .github/PULL_REQUEST_TEMPLATE/release_candidate.md)
            else
              BODY_ARGS=(--body "Promote Release Candidate changes from stage to prod.")
            fi
            # A concurrent run may have created it between the list and this
            # call, which is not a failure; the read-back below is what decides.
            gh pr create --base prod --head stage --title "$PR_TITLE" "${BODY_ARGS[@]}" \
              || echo "::warning::gh pr create did not succeed; checking whether the PR exists anyway."
            PR_NUMBER=$(gh pr list --base prod --head stage --state open --json number --jq '.[0].number // empty')
          else
            echo "Existing open Release Candidate PR found (#${PR_NUMBER})."
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Release Candidate PR was neither found nor created."
            exit 1
          fi

          # Best effort: an assignee who is not a collaborator is not a reason
          # to fail a release candidate that exists.
          gh pr edit "$PR_NUMBER" --add-assignee "$TARGET_ASSIGNEE" \
            || echo "::warning::Could not assign ${TARGET_ASSIGNEE} to PR #${PR_NUMBER}."

          echo "Release Candidate PR #${PR_NUMBER} is open."
          echo "Release candidate: [#${PR_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})" >> "$GITHUB_STEP_SUMMARY"
