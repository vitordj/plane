# =============================================================================
# Prod: Image Promotion & Deploy (Plane Orca Production)
# =============================================================================
#
# When: You push to the "main" branch.
# Where: Runs on GitHub Actions runners (ubuntu-latest).
#
# What happens:
#   • Promote Images: Avoids recompiling code by promoting the images GHCR
#     already holds — resolved by the digest built from the stage commit this
#     release contains, not by the mutable :stage tag — and retagging them
#     :latest and :v<version>. Promotion aborts before any retag if a service's
#     :stage tag no longer points at the image built from that commit.
#   • Deploy: Triggers Coolify production deployment, polls state until completion,
#     and outputs step summaries or issues cancellations.
#
# Deployment is opt-in:
#   The Coolify deploy job only runs when the repository (or "prod"
#   environment) variable COOLIFY_DEPLOY_ENABLED is set to the string "true".
#   Leave it unset and image promotion still happens — only the deploy job is
#   skipped, instead of failing on absent credentials. The deploy code below is
#   kept intact so turning the variable on is the only step needed to resume.
#
# What you need in GitHub Secrets (only when COOLIFY_DEPLOY_ENABLED is "true"):
#   • COOLIFY_DEPLOY_URL - Full production deploy URL with uuid parameter.
#   • COOLIFY_API_TOKEN  - Authorization bearer token for your Coolify API.
#
# Environment Configuration:
#   • Targets the GitHub Environment named "prod" to resolve secrets.
#
# =============================================================================

name: Production CI/CD

on:
  push:
    branches:
      - prod

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; promote and sync-stage widen it themselves.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote Images (Stage -> Production)
    if: "${{ contains(github.event.head_commit.message, 'chore(prod): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Lowercase Image Name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ORCA CUSTOM FEATURE: production promotes by digest, not by the :stage
      # tag. :stage is mutable — it points at whatever built last — so promoting
      # it means production runs whatever happened to be pushed, not the commit
      # that was reviewed in the release candidate. Here the workflow resolves
      # the newest stage commit this release actually contains, finds the image
      # built for it (services are built on a path filter, so the tag may sit a
      # few commits back for a service that did not change), and refuses to
      # promote if :stage has since drifted away from that image.
      - name: Resolve Images To Promote
        id: resolve
        run: |
          set -euo pipefail

          git fetch --no-tags --quiet origin stage

          # Newest stage commit that is an ancestor of this release commit,
          # plus the ones behind it: a service unchanged in the tip commit was
          # not rebuilt there and keeps the tag from its last real change.
          ANCESTORS=()
          for sha in $(git rev-list --max-count=300 origin/stage); do
            if git merge-base --is-ancestor "$sha" HEAD; then
              ANCESTORS+=("$sha")
            fi
            if [ "${#ANCESTORS[@]}" -ge 50 ]; then
              break
            fi
          done

          if [ "${#ANCESTORS[@]}" -eq 0 ]; then
            echo "::error::No stage commit is an ancestor of this release commit; nothing can be promoted"
            exit 1
          fi
          echo "Release contains stage commit ${ANCESTORS[0]}"

          digest_of() {
            docker manifest inspect -v "$1" 2>/dev/null \
              | jq -r 'if type == "array" then .[0].Descriptor.digest else .Descriptor.digest end' \
              | head -n 1
          }

          : > promotion-plan.txt
          failed=0
          for app in web admin api space live proxy; do
            image="${REGISTRY}/${IMAGE_NAME}/${app}"

            stage_digest="$(digest_of "${image}:stage" || true)"
            if [ -z "$stage_digest" ] || [ "$stage_digest" = "null" ]; then
              echo "::error::${app}:stage does not exist in the registry"
              failed=1
              continue
            fi

            built_sha=""
            built_digest=""
            for sha in "${ANCESTORS[@]}"; do
              candidate="$(digest_of "${image}:sha-${sha}" || true)"
              if [ -n "$candidate" ] && [ "$candidate" != "null" ]; then
                built_sha="$sha"
                built_digest="$candidate"
                break
              fi
            done

            if [ -z "$built_digest" ]; then
              echo "::error::${app} has no :sha-<commit> image in the promoted history; it did not pass stage CI"
              failed=1
              continue
            fi

            if [ "$built_digest" != "$stage_digest" ]; then
              echo "::error::${app}:stage ($stage_digest) is not the image built for ${built_sha} ($built_digest); staging moved after the release candidate"
              failed=1
              continue
            fi

            echo "${app} ${built_digest} ${built_sha}" >> promotion-plan.txt
            echo "${app}: ${built_digest} (built from ${built_sha})"
          done

          # Every service is verified before the first retag: a partial
          # promotion would leave production running two different releases.
          if [ "$failed" -ne 0 ]; then
            echo "::error::Refusing to promote; nothing has been retagged"
            exit 1
          fi

      - name: Promote Docker Images
        run: |
          set -euo pipefail

          while read -r app digest sha; do
            image="${REGISTRY}/${IMAGE_NAME}/${app}"
            echo "Promoting ${app} from ${digest} (stage commit ${sha})..."
            docker pull "${image}@${digest}"
            for tag in latest "${VERSION}" "v${VERSION}"; do
              docker tag "${image}@${digest}" "${image}:${tag}"
              docker push "${image}:${tag}"
            done
          done < promotion-plan.txt

          {
            echo "## Promoted images"
            echo ""
            echo "| Service | Digest | Stage commit |"
            echo "|---|---|---|"
            while read -r app digest sha; do
              echo "| ${app} | \`${digest}\` | \`${sha:0:7}\` |"
            done < promotion-plan.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update GitHub Releases with Official Container Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLEAN_VER="${{ env.VERSION }}"
          CLEAN_VER="${CLEAN_VER#v}"
          TAG="v${CLEAN_VER}"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          EXISTING_NOTES=$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || true)
          if [ -n "$EXISTING_NOTES" ] && [[ "$EXISTING_NOTES" != *"Production Container Artifacts"* ]]; then
            HEADER=$(printf "### 🐳 Production Container Artifacts\n- **Web App**: \`%s/web:v%s\`\n- **Admin Panel**: \`%s/admin:v%s\`\n- **API Backend**: \`%s/api:v%s\`\n- **Space**: \`%s/space:v%s\`\n- **Live WebSockets**: \`%s/live:v%s\`\n- **Proxy Gateway**: \`%s/proxy:v%s\`\n- **Pull Commands**:\n\`\`\`bash\ndocker pull %s/web:v%s\ndocker pull %s/admin:v%s\ndocker pull %s/api:v%s\ndocker pull %s/space:v%s\ndocker pull %s/live:v%s\ndocker pull %s/proxy:v%s\n\`\`\`" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER" "$IMAGE_BASE" "$CLEAN_VER")
            COMBINED_NOTES="${HEADER}"$'\n\n---\n\n'"${EXISTING_NOTES}"
            gh release edit "$TAG" --notes "$COMBINED_NOTES" || true
          fi

      # The digests are the record of what production is running: without them
      # a rollback has to guess which image the previous release used.
      - name: Record Promoted Digests In Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CLEAN_VER="${VERSION#v}"
          TAG="v${CLEAN_VER}"

          NOTES=$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            echo "No release ${TAG} to annotate yet."
            exit 0
          fi
          if printf '%s' "$NOTES" | grep -q "Promoted image digests"; then
            echo "Digests already recorded on ${TAG}."
            exit 0
          fi

          TABLE=$(
            printf '### 🔒 Promoted image digests\n\n| Service | Digest | Stage commit |\n|---|---|---|\n'
            while read -r app digest sha; do
              printf '| %s | `%s` | `%s` |\n' "$app" "$digest" "$sha"
            done < promotion-plan.txt
          )
          gh release edit "$TAG" --notes "$(printf '%s\n\n---\n\n%s' "$TABLE" "$NOTES")"

  deploy:
    name: Deploy to Production (Coolify)
    needs: promote
    if: ${{ vars.COOLIFY_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Trigger Coolify deploy
        id: deploy
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          if [ -z "$deploy_url" ]; then
            echo "::error::COOLIFY_DEPLOY_URL is empty."
            exit 1
          fi
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          uuid="${deploy_url#*uuid=}"
          uuid="${uuid%%&*}"
          success=0
          for i in 1 2 3; do
            if resp=$(curl -f -sS --max-time 30 -X POST "${base}/deploy" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\": \"${uuid}\"}"); then
              success=1
              echo "$resp" > deploy_response.json
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Wait for deployment
        id: wait
        if: success()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then
            echo "::error::Could not read deployment UUID."
            exit 1
          fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          token="${{ secrets.COOLIFY_API_TOKEN }}"
          timeout_sec=900
          interval=20
          elapsed=0
          while [ $elapsed -lt $timeout_sec ]; do
            curl -sS --max-time 30 -X GET "${base}/deployments/${dep_uuid}" \
              -H "Authorization: Bearer ${token}" -o deployment.json 2>/dev/null || true
            status=$(python3 -c "
          import json
          try:
              print(json.load(open('deployment.json')).get('status','').lower())
          except Exception:
              print('')
          " 2>/dev/null || true)
            case "$status" in
              finished|success) break ;;
              failed|cancelled|cancelled-by-user) echo "Coolify deployment failed or was cancelled: $status"; exit 1 ;;
              *) ;;
            esac
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $elapsed -ge $timeout_sec ]; then
            echo "Deployment did not finish within ${timeout_sec}s"
            exit 1
          fi
          echo "elapsed_sec=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        if: success() && steps.wait.outcome == 'success'
        env:
          ELAPSED_SEC: ${{ steps.wait.outputs.elapsed_sec }}
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          dashboard="${base%/api/v1}"
          [ "$dashboard" = "$base" ] && dashboard="${base%/api}"
          export DASHBOARD="$dashboard"
          export GITHUB_SERVER_URL="${{ github.server_url }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          export ELAPSED_SEC="${ELAPSED_SEC:-0}"
          python3 << 'PY'
          import json, os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          dashboard = (os.environ.get('DASHBOARD') or '').rstrip('/')
          gh_server = os.environ.get('GITHUB_SERVER_URL', '')
          gh_repo = os.environ.get('GITHUB_REPOSITORY', '')
          gh_sha = os.environ.get('GITHUB_SHA', '')
          branch = os.environ.get('GITHUB_REF_NAME', '—')
          try:
              elapsed_sec = int(os.environ.get('ELAPSED_SEC', 0))
          except Exception:
              elapsed_sec = 0
          def format_duration(s):
              if s < 60:
                  return f'{s}s'
              m, s = divmod(s, 60)
              return f'{m}m {s}s' if s else f'{m}m'
          deploy_duration = format_duration(elapsed_sec) if elapsed_sec else '—'
          try:
              with open('deployment.json') as f:
                  d = json.load(f)
          except Exception:
              d = {}
          app = d.get('application_name', 'N/A')
          status = (d.get('status') or 'N/A').lower()
          status_display = '✅ ' + status if status in ('finished', 'success') else status
          coolify_path = (d.get('deployment_url') or '').strip()
          if coolify_path and dashboard and not (coolify_path.startswith('http://') or coolify_path.startswith('https://')):
              full_coolify_url = dashboard + coolify_path if coolify_path.startswith('/') else coolify_path
          else:
              full_coolify_url = dashboard if dashboard else ''
          coolify_url_cell = f'[Link]({full_coolify_url})' if full_coolify_url else '—'
          commit = d.get('commit') or d.get('commit_message') or gh_sha or '—'
          commit_sha = (d.get('commit') or gh_sha or '').strip()
          if commit_sha and gh_server and gh_repo:
              short_sha = commit_sha[:7] if len(commit_sha) >= 7 else commit_sha
              commit_cell = f'[{short_sha}]({gh_server}/{gh_repo}/commit/{commit_sha})'
          else:
              commit_cell = commit
          lines = [
              '## Coolify deployment',
              '',
              '| Property | Value |',
              '|---|-----|',
              f'| **Application** | {app} |',
              f'| **Status** | {status_display} |',
              f'| **Branch** | {branch} |',
              f'| **Deploy duration** | {deploy_duration} |',
              f'| **Commit** | {commit_cell} |',
              f'| **Coolify URL** | {coolify_url_cell} |',
              '',
          ]
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write('\n'.join(lines) + '\n')
          PY

      - name: Cancel Coolify deployment (if job cancelled)
        if: cancelled()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then exit 0; fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          curl -sS --max-time 15 -X POST "${base}/deployments/${dep_uuid}/cancel" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" || true

      - name: Deployment failed summary
        if: failure()
        run: |
          branch="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          repo="${{ github.repository }}"
          server="${{ github.server_url }}"
          commit_link="[${short_sha}](${server}/${repo}/commit/${sha})"
          {
            echo '## Deployment failed'
            echo ''
            echo 'Deployment failed, was cancelled, or timed out.'
            echo ''
            echo '| | |'
            echo '|---|-----|'
            echo "| **Branch** | ${branch} |"
            echo "| **Commit** | ${commit_link} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-stage:
    name: Sync Prod to Stage
    if: "${{ contains(github.event.head_commit.message, 'chore(prod): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: stage
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge prod branch into stage
        run: |
          git fetch origin prod:prod
          git merge prod -m "orca-chore: sync prod back to stage [skip ci]" --no-ff
          git push origin stage

