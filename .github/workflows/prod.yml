# =============================================================================
# Prod: Image Promotion & Deploy (Plane Orca Production)
# =============================================================================
#
# When: You push to the "main" branch.
# Where: Runs on GitHub Actions runners (ubuntu-latest).
#
# What happens:
#   • Promote Images: Avoids recompiling code by re-tagging, by digest, the
#     images that the stage CI built for the exact commit being released —
#     the immutable :sha-<commit> tags, never the moving :stage pointer.
#     Fails before touching a tag if any of the six is missing.
#   • Deploy: Triggers Coolify production deployment, polls state until completion,
#     and outputs step summaries or issues cancellations.
#
# Promoting a specific commit by hand (rehearsal, re-promotion after an
# incident): run this workflow from the Actions tab and pass the stage commit
# in the "stage_sha" input. See docs/release-runbook.md.
#
# Deployment is opt-in:
#   The Coolify deploy job only runs when the repository (or "prod"
#   environment) variable COOLIFY_DEPLOY_ENABLED is set to the string "true".
#   Leave it unset and image promotion still happens — only the deploy job is
#   skipped, instead of failing on absent credentials. The deploy code below is
#   kept intact so turning the variable on is the only step needed to resume.
#
# What you need in GitHub Secrets (only when COOLIFY_DEPLOY_ENABLED is "true"):
#   • COOLIFY_DEPLOY_URL - Full production deploy URL with uuid parameter.
#   • COOLIFY_API_TOKEN  - Authorization bearer token for your Coolify API.
#
# Environment Configuration:
#   • Targets the GitHub Environment named "prod" to resolve secrets.
#
# =============================================================================

name: Production CI/CD

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      stage_sha:
        description: 'Stage commit to promote (full 40-char SHA). Leave empty to resolve it from the prod history.'
        required: false
        type: string

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the promote job declares the writes it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote Images (Stage -> Production)
    if: "${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'chore(prod): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Lowercase Image Name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Full history: the commit being released is found by walking the prod
      # history back to the merge that brought stage in.
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ---------------------------------------------------------------------
      # Which commit is being released.
      #
      # `:stage` moves with every push to the stage branch, so promoting from
      # it released whatever had been built most recently — not necessarily the
      # commit the release PR was reviewed and approved on. The release commit
      # itself (`chore(prod): release`) sits on top of the merge that brought
      # stage into prod, so the second parent of the newest merge in this
      # history is the stage commit under release, and stage CI tagged exactly
      # that commit as `:sha-<commit>`.
      # ---------------------------------------------------------------------
      - name: Resolve The Stage Commit Under Release
        id: stage_sha
        env:
          INPUT_SHA: ${{ inputs.stage_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin stage

          if [ -n "${INPUT_SHA}" ]; then
            sha=$(git rev-parse --verify "${INPUT_SHA}^{commit}")
            echo "Promoting the commit given as input: ${sha}"
          else
            merge=$(git rev-list --merges -n 1 HEAD || true)
            if [ -z "${merge}" ]; then
              echo "::error::No merge commit in the prod history, so the stage commit under release cannot be identified. Re-run this workflow with the stage_sha input (see docs/release-runbook.md)."
              exit 1
            fi
            if ! sha=$(git rev-parse --verify "${merge}^2" 2>/dev/null); then
              echo "::error::${merge} has no second parent — the release candidate seems to have been squashed. Re-run with the stage_sha input (see docs/release-runbook.md)."
              exit 1
            fi
          fi

          # The commit being promoted has to be one that actually reached the
          # stage branch: that is what "it went through stage CI" means.
          if ! git merge-base --is-ancestor "${sha}" origin/stage; then
            echo "::error::${sha} is not an ancestor of origin/stage; refusing to promote a commit that never landed on stage."
            exit 1
          fi

          echo "STAGE_SHA=${sha}" >> "$GITHUB_ENV"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Releasing stage commit ${sha}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A half-promoted release — three services on the new version, three on
      # the old — is worse than a failed one, so every image is resolved before
      # any tag is written.
      - name: Verify Every Service Was Built For This Commit
        id: resolve
        run: |
          set -euo pipefail
          image_base="${REGISTRY}/${IMAGE_NAME}"
          : > promoted-digests.txt
          missing=""

          for app in web admin api space live proxy; do
            src="${image_base}/${app}:sha-${STAGE_SHA}"
            digest=$(docker buildx imagetools inspect "${src}" --format '{{.Manifest.Digest}}' 2>/dev/null | tr -d '[:space:]') || digest=""
            if [ -z "${digest}" ]; then
              echo "::error::${src} does not exist: this commit did not pass through the stage CI for ${app}."
              missing="${missing} ${app}"
              continue
            fi
            echo "${app} ${digest}" >> promoted-digests.txt
            echo "${app}: ${digest}"
          done

          if [ -n "${missing}" ]; then
            echo "::error::Refusing to promote; no tag was written. Missing images for:${missing}"
            exit 1
          fi

      - name: Promote Docker Images
        run: |
          set -euo pipefail
          image_base="${REGISTRY}/${IMAGE_NAME}"
          while read -r app digest; do
            echo "Promoting ${app} (${digest})..."
            # By digest, not by pull-and-retag: this publishes the very bytes
            # stage CI built, and keeps a multi-arch manifest intact.
            docker buildx imagetools create \
              --tag "${image_base}/${app}:latest" \
              --tag "${image_base}/${app}:${VERSION}" \
              --tag "${image_base}/${app}:v${VERSION}" \
              "${image_base}/${app}@${digest}"
          done < promoted-digests.txt

      - name: Write Promotion Summary
        run: |
          set -euo pipefail
          image_base="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "## Promoted to production"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | v${VERSION} |"
            echo "| **Stage commit** | [\`${STAGE_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${STAGE_SHA}) |"
            echo ""
            echo "| Service | Digest |"
            echo "|---|---|"
            while read -r app digest; do
              echo "| ${app} | \`${digest}\` |"
            done < promoted-digests.txt
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Promoted Digests
        uses: actions/upload-artifact@v4
        with:
          name: promoted-digests
          path: promoted-digests.txt
          retention-days: 90
          if-no-files-found: error

      # The release notes are where an incident response looks first, so they
      # carry the digests actually promoted and the stage commit they were
      # built from — a `:v<version>` tag alone can be moved later, a digest
      # cannot.
      - name: Update GitHub Releases with Official Container Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_VER="${VERSION#v}"
          TAG="v${CLEAN_VER}"
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"

          EXISTING_NOTES=$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || true)
          if [ -z "$EXISTING_NOTES" ] || [[ "$EXISTING_NOTES" == *"Production Container Artifacts"* ]]; then
            echo "Release $TAG has no notes yet, or already lists its artifacts; leaving it as is."
            exit 0
          fi

          {
            echo "### 🐳 Production Container Artifacts"
            echo ""
            echo "Promoted from stage commit \`${STAGE_SHA}\` — the images below are"
            echo "the exact artifacts its CI built, re-tagged by digest."
            echo ""
            echo "| Service | Tag | Digest |"
            echo "|---|---|---|"
            while read -r app digest; do
              echo "| ${app} | \`${IMAGE_BASE}/${app}:v${CLEAN_VER}\` | \`${digest}\` |"
            done < promoted-digests.txt
            echo ""
            echo "Pull by digest (immutable):"
            echo ""
            echo '```bash'
            while read -r app digest; do
              echo "docker pull ${IMAGE_BASE}/${app}@${digest}"
            done < promoted-digests.txt
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "${EXISTING_NOTES}"
          } > release-notes.md

          # The images are already promoted at this point; a failure to edit the
          # notes must not block the deploy that follows. The digests are also
          # in the run summary and the promoted-digests artifact.
          gh release edit "$TAG" --notes-file release-notes.md \
            || echo "::warning::Could not update the notes of release ${TAG}; digests are in the run summary and the promoted-digests artifact."

  deploy:
    name: Deploy to Production (Coolify)
    needs: promote
    if: ${{ vars.COOLIFY_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Trigger Coolify deploy
        id: deploy
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          if [ -z "$deploy_url" ]; then
            echo "::error::COOLIFY_DEPLOY_URL is empty."
            exit 1
          fi
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          uuid="${deploy_url#*uuid=}"
          uuid="${uuid%%&*}"
          success=0
          for i in 1 2 3; do
            if resp=$(curl -f -sS --max-time 30 -X POST "${base}/deploy" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\": \"${uuid}\"}"); then
              success=1
              echo "$resp" > deploy_response.json
              break
            fi
            [ $i -lt 3 ] && sleep 10
          done
          [ "$success" -eq 1 ] || exit 1

      - name: Wait for deployment
        id: wait
        if: success()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then
            echo "::error::Could not read deployment UUID."
            exit 1
          fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          token="${{ secrets.COOLIFY_API_TOKEN }}"
          timeout_sec=900
          interval=20
          elapsed=0
          while [ $elapsed -lt $timeout_sec ]; do
            curl -sS --max-time 30 -X GET "${base}/deployments/${dep_uuid}" \
              -H "Authorization: Bearer ${token}" -o deployment.json 2>/dev/null || true
            status=$(python3 -c "
          import json
          try:
              print(json.load(open('deployment.json')).get('status','').lower())
          except Exception:
              print('')
          " 2>/dev/null || true)
            case "$status" in
              finished|success) break ;;
              failed|cancelled|cancelled-by-user) echo "Coolify deployment failed or was cancelled: $status"; exit 1 ;;
              *) ;;
            esac
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          if [ $elapsed -ge $timeout_sec ]; then
            echo "Deployment did not finish within ${timeout_sec}s"
            exit 1
          fi
          echo "elapsed_sec=$elapsed" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        if: success() && steps.wait.outcome == 'success'
        env:
          ELAPSED_SEC: ${{ steps.wait.outputs.elapsed_sec }}
        run: |
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          dashboard="${base%/api/v1}"
          [ "$dashboard" = "$base" ] && dashboard="${base%/api}"
          export DASHBOARD="$dashboard"
          export GITHUB_SERVER_URL="${{ github.server_url }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          export ELAPSED_SEC="${ELAPSED_SEC:-0}"
          python3 << 'PY'
          import json, os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          dashboard = (os.environ.get('DASHBOARD') or '').rstrip('/')
          gh_server = os.environ.get('GITHUB_SERVER_URL', '')
          gh_repo = os.environ.get('GITHUB_REPOSITORY', '')
          gh_sha = os.environ.get('GITHUB_SHA', '')
          branch = os.environ.get('GITHUB_REF_NAME', '—')
          try:
              elapsed_sec = int(os.environ.get('ELAPSED_SEC', 0))
          except Exception:
              elapsed_sec = 0
          def format_duration(s):
              if s < 60:
                  return f'{s}s'
              m, s = divmod(s, 60)
              return f'{m}m {s}s' if s else f'{m}m'
          deploy_duration = format_duration(elapsed_sec) if elapsed_sec else '—'
          try:
              with open('deployment.json') as f:
                  d = json.load(f)
          except Exception:
              d = {}
          app = d.get('application_name', 'N/A')
          status = (d.get('status') or 'N/A').lower()
          status_display = '✅ ' + status if status in ('finished', 'success') else status
          coolify_path = (d.get('deployment_url') or '').strip()
          if coolify_path and dashboard and not (coolify_path.startswith('http://') or coolify_path.startswith('https://')):
              full_coolify_url = dashboard + coolify_path if coolify_path.startswith('/') else coolify_path
          else:
              full_coolify_url = dashboard if dashboard else ''
          coolify_url_cell = f'[Link]({full_coolify_url})' if full_coolify_url else '—'
          commit = d.get('commit') or d.get('commit_message') or gh_sha or '—'
          commit_sha = (d.get('commit') or gh_sha or '').strip()
          if commit_sha and gh_server and gh_repo:
              short_sha = commit_sha[:7] if len(commit_sha) >= 7 else commit_sha
              commit_cell = f'[{short_sha}]({gh_server}/{gh_repo}/commit/{commit_sha})'
          else:
              commit_cell = commit
          lines = [
              '## Coolify deployment',
              '',
              '| Property | Value |',
              '|---|-----|',
              f'| **Application** | {app} |',
              f'| **Status** | {status_display} |',
              f'| **Branch** | {branch} |',
              f'| **Deploy duration** | {deploy_duration} |',
              f'| **Commit** | {commit_cell} |',
              f'| **Coolify URL** | {coolify_url_cell} |',
              '',
          ]
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write('\n'.join(lines) + '\n')
          PY

      - name: Cancel Coolify deployment (if job cancelled)
        if: cancelled()
        run: |
          dep_uuid=$(python3 -c "
          import json
          try:
              d=json.load(open('deploy_response.json'))
              print(d.get('deployments', [{}])[0].get('deployment_uuid',''))
          except Exception:
              pass
          " 2>/dev/null || true)
          if [ -z "$dep_uuid" ]; then exit 0; fi
          deploy_url="${{ secrets.COOLIFY_DEPLOY_URL }}"
          base="${deploy_url%%\?*}"
          base="${base%/deploy}"
          curl -sS --max-time 15 -X POST "${base}/deployments/${dep_uuid}/cancel" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" || true

      - name: Deployment failed summary
        if: failure()
        run: |
          branch="${{ github.ref_name }}"
          sha="${{ github.sha }}"
          short_sha="${sha:0:7}"
          repo="${{ github.repository }}"
          server="${{ github.server_url }}"
          commit_link="[${short_sha}](${server}/${repo}/commit/${sha})"
          {
            echo '## Deployment failed'
            echo ''
            echo 'Deployment failed, was cancelled, or timed out.'
            echo ''
            echo '| | |'
            echo '|---|-----|'
            echo "| **Branch** | ${branch} |"
            echo "| **Commit** | ${commit_link} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-stage:
    name: Sync Prod to Stage
    if: "${{ contains(github.event.head_commit.message, 'chore(prod): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: stage
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge prod branch into stage
        run: |
          git fetch origin prod:prod
          git merge prod -m "orca-chore: sync prod back to stage [skip ci]" --no-ff
          git push origin stage

