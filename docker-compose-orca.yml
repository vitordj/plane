# Images are published by .github/workflows/stage.yml under the namespace of
# the repository that ran the workflow (ghcr.io/<owner>/<repo>/<service>). The
# default below MUST match that namespace, otherwise this file deploys someone
# else's build of the code you reviewed; the `compose_provenance` CI job fails
# when the two drift apart. Override ORCA_IMAGE_REPOSITORY only to deploy a
# mirror, and prefer an immutable TAG (sha-<commit>) over the moving `stage`.
version: '3.8'

services:
  web:
    container_name: web
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/web:${TAG:-stage}
    pull_policy: always
    restart: always
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  admin:
    container_name: admin
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/admin:${TAG:-stage}
    pull_policy: always
    restart: always
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/god-mode/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  space:
    container_name: space
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/space:${TAG:-stage}
    pull_policy: always
    restart: always
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/spaces/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    container_name: api
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/api:${TAG:-stage}
    pull_policy: always
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    environment:
      - SERVICE_HEX_64_DJANGO
      - SECRET_KEY=${SERVICE_HEX_64_DJANGO}
      - SERVICE_HEX_64_LIVE
      - LIVE_SERVER_SECRET_KEY=${SERVICE_HEX_64_LIVE}
      - DOMAIN_NAME=${SERVICE_FQDN_PROXY:-localhost}
      - DATABASE_URL=postgres://${SERVICE_USER_DATABASE:-plane}:${SERVICE_PASSWORD_DATABASE:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      - REDIS_URL=redis://plane-redis:6379/0
      - AMQP_URL=amqp://${SERVICE_USER_RABBITMQ:-plane}:${SERVICE_PASSWORD_RABBITMQ:-plane}@plane-mq:5672//
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_AWS:-access-key}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_AWS:-secret-key}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - USE_MINIO=1
      # Orca organizational layer. The same value has to reach the API, the
      # worker, the beat and the migrator: a worker without the kill switch
      # would keep writing ProjectMember rows after the API went dark.
      - ORCA_ORG_UNITS_ENABLED=${ORCA_ORG_UNITS_ENABLED:-1}
      - ORCA_ORG_SYNC_MAX_EDGES=${ORCA_ORG_SYNC_MAX_EDGES:-100}
      - SCIM_RATE_LIMIT=${SCIM_RATE_LIMIT:-600/minute}
      - SCIM_AUTH_FAILURE_RATE_LIMIT=${SCIM_AUTH_FAILURE_RATE_LIMIT:-30/minute}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
      - SERVICE_URL_PROXY
      - "WEB_URL=${SERVICE_URL_PROXY:-http://localhost:8000}"
    depends_on:
      - plane-db
      - plane-redis
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 350M

  worker:
    container_name: bgworker
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/api:${TAG:-stage}
    pull_policy: always
    restart: always
    x-exclude_from_hc: true
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      - SECRET_KEY=${SERVICE_HEX_64_DJANGO}
      - LIVE_SERVER_SECRET_KEY=${SERVICE_HEX_64_LIVE}
      - DOMAIN_NAME=${SERVICE_FQDN_PROXY:-localhost}
      - DATABASE_URL=postgres://${SERVICE_USER_DATABASE:-plane}:${SERVICE_PASSWORD_DATABASE:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      - REDIS_URL=redis://plane-redis:6379/0
      - AMQP_URL=amqp://${SERVICE_USER_RABBITMQ:-plane}:${SERVICE_PASSWORD_RABBITMQ:-plane}@plane-mq:5672//
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_AWS:-access-key}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_AWS:-secret-key}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - USE_MINIO=1
      # Orca organizational layer. The same value has to reach the API, the
      # worker, the beat and the migrator: a worker without the kill switch
      # would keep writing ProjectMember rows after the API went dark.
      - ORCA_ORG_UNITS_ENABLED=${ORCA_ORG_UNITS_ENABLED:-1}
      - ORCA_ORG_SYNC_MAX_EDGES=${ORCA_ORG_SYNC_MAX_EDGES:-100}
      - SCIM_RATE_LIMIT=${SCIM_RATE_LIMIT:-600/minute}
      - SCIM_AUTH_FAILURE_RATE_LIMIT=${SCIM_AUTH_FAILURE_RATE_LIMIT:-30/minute}
      - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
      - SERVICE_URL_PROXY
      - "WEB_URL=${SERVICE_URL_PROXY:-http://localhost:8000}"
    depends_on:
      - api
      - plane-db
      - plane-redis
    deploy:
      resources:
        limits:
          memory: 350M

  beat-worker:
    container_name: beatworker
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/api:${TAG:-stage}
    pull_policy: always
    restart: always
    x-exclude_from_hc: true
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      - SECRET_KEY=${SERVICE_HEX_64_DJANGO}
      - LIVE_SERVER_SECRET_KEY=${SERVICE_HEX_64_LIVE}
      - DOMAIN_NAME=${SERVICE_FQDN_PROXY:-localhost}
      - DATABASE_URL=postgres://${SERVICE_USER_DATABASE:-plane}:${SERVICE_PASSWORD_DATABASE:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      - REDIS_URL=redis://plane-redis:6379/0
      - AMQP_URL=amqp://${SERVICE_USER_RABBITMQ:-plane}:${SERVICE_PASSWORD_RABBITMQ:-plane}@plane-mq:5672//
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_AWS:-access-key}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_AWS:-secret-key}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - USE_MINIO=1
      # Orca organizational layer. The same value has to reach the API, the
      # worker, the beat and the migrator: a worker without the kill switch
      # would keep writing ProjectMember rows after the API went dark.
      - ORCA_ORG_UNITS_ENABLED=${ORCA_ORG_UNITS_ENABLED:-1}
      - ORCA_ORG_SYNC_MAX_EDGES=${ORCA_ORG_SYNC_MAX_EDGES:-100}
      - SCIM_RATE_LIMIT=${SCIM_RATE_LIMIT:-600/minute}
      - SCIM_AUTH_FAILURE_RATE_LIMIT=${SCIM_AUTH_FAILURE_RATE_LIMIT:-30/minute}
      - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
      - SERVICE_URL_PROXY
      - "WEB_URL=${SERVICE_URL_PROXY:-http://localhost:8000}"
    depends_on:
      - api
      - plane-db
      - plane-redis
    deploy:
      resources:
        limits:
          memory: 150M

  migrator:
    container_name: plane-migrator
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/api:${TAG:-stage}
    pull_policy: always
    restart: "no"
    x-exclude_from_hc: true
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      - SECRET_KEY=${SERVICE_HEX_64_DJANGO}
      - LIVE_SERVER_SECRET_KEY=${SERVICE_HEX_64_LIVE}
      - DOMAIN_NAME=${SERVICE_FQDN_PROXY:-localhost}
      - DATABASE_URL=postgres://${SERVICE_USER_DATABASE:-plane}:${SERVICE_PASSWORD_DATABASE:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      - REDIS_URL=redis://plane-redis:6379/0
      - AMQP_URL=amqp://${SERVICE_USER_RABBITMQ:-plane}:${SERVICE_PASSWORD_RABBITMQ:-plane}@plane-mq:5672//
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_AWS:-access-key}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_AWS:-secret-key}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - USE_MINIO=1
      # Orca organizational layer. The same value has to reach the API, the
      # worker, the beat and the migrator: a worker without the kill switch
      # would keep writing ProjectMember rows after the API went dark.
      - ORCA_ORG_UNITS_ENABLED=${ORCA_ORG_UNITS_ENABLED:-1}
      - ORCA_ORG_SYNC_MAX_EDGES=${ORCA_ORG_SYNC_MAX_EDGES:-100}
      - SCIM_RATE_LIMIT=${SCIM_RATE_LIMIT:-600/minute}
      - SCIM_AUTH_FAILURE_RATE_LIMIT=${SCIM_AUTH_FAILURE_RATE_LIMIT:-30/minute}
      - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
      - SERVICE_URL_PROXY
      - "WEB_URL=${SERVICE_URL_PROXY:-http://localhost:8000}"
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/live:${TAG:-stage}
    pull_policy: always
    restart: always
    environment:
      - SECRET_KEY=${SERVICE_HEX_64_DJANGO}
      - LIVE_SERVER_SECRET_KEY=${SERVICE_HEX_64_LIVE}
      - DOMAIN_NAME=${SERVICE_FQDN_PROXY:-localhost}
      - DATABASE_URL=postgres://${SERVICE_USER_DATABASE:-plane}:${SERVICE_PASSWORD_DATABASE:-plane}@plane-db:5432/${POSTGRES_DB:-plane}
      - REDIS_URL=redis://plane-redis:6379/0
      - API_BASE_URL=http://api:8000
      - AMQP_URL=amqp://${SERVICE_USER_RABBITMQ:-plane}:${SERVICE_PASSWORD_RABBITMQ:-plane}@plane-mq:5672//
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_AWS:-access-key}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_AWS:-secret-key}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - USE_MINIO=1
      - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 150M

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${SERVICE_USER_DATABASE:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DATABASE:-plane}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-plane} -d $${POSTGRES_DB:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 100M

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBITMQ:-plane}
      RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_RABBITMQ:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 300M

  plane-minio:
    container_name: plane-minio
    # Pinned: an untagged image is whatever :latest resolved to on the day a
    # container was pulled, so two environments -- or the same environment
    # before and after a redeploy -- could run different MinIO builds. Bump
    # deliberately; the tag below is what :latest pointed at when it was set.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_AWS:-access-key}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_AWS:-secret-key}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 250M

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    image: ${ORCA_IMAGE_REPOSITORY:-ghcr.io/vitordj/plane}/proxy:${TAG:-stage}
    pull_policy: always
    restart: always
    expose:
      - 80
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: :80
      # Required: the Caddyfile has no fallback, and the variable was not even
      # forwarded here before, so the proxy always fell back to trusting every
      # source. Set it to the CIDR of the Coolify/ingress network.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:?set it to the CIDR of the proxy network in front of Caddy, e.g. 10.0.0.0/8}"
    depends_on:
      - web
      - api
      - space
      - admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
