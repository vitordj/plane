[project]
name = "Plane"
version = "0.24.0"
description = "Open-source project management that unlocks customer value"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "**/migrations/*",
]

# Same as Black.
line-length = 120
indent-width = 4

[tool.ruff.format]
# Temporary: files that come straight from upstream Plane and have never been
# touched by this fork. `ruff format --check` is enforced in CI (P0.9) and
# these 38 files do not satisfy it, but reformatting them would rewrite
# code the fork does not own and turn every upstream sync into a conflict.
# They are excluded by name — never by directory — so a file that the fork
# starts editing has to be removed from this list and formatted. Delete the
# whole block during the next upstream sync (P0.11), where the churn is
# already being paid for.
exclude = [
    "plane/api/views/asset.py",
    "plane/app/serializers/workspace.py",
    "plane/app/views/asset/v2.py",
    "plane/app/views/issue/attachment.py",
    "plane/authentication/provider/credentials/email.py",
    "plane/authentication/provider/credentials/magic_code.py",
    "plane/authentication/provider/oauth/github.py",
    "plane/bgtasks/page_version_task.py",
    "plane/db/management/commands/create_project_member.py",
    "plane/db/models/estimate.py",
    "plane/db/models/state.py",
    "plane/license/api/serializers/workspace.py",
    "plane/license/bgtasks/telemetry_metrics.py",
    "plane/space/views/asset.py",
    "plane/tests/contract/api/test_authentication.py",
    "plane/tests/contract/api/test_project_members_roster_scope.py",
    "plane/tests/contract/app/test_authentication.py",
    "plane/tests/contract/app/test_cycle_issue_app.py",
    "plane/tests/contract/app/test_deploy_board_project_scope_app.py",
    "plane/tests/contract/app/test_issue_list_guest_scope_app.py",
    "plane/tests/contract/app/test_page_version_project_scope_app.py",
    "plane/tests/contract/app/test_project_member_is_active_authz.py",
    "plane/tests/contract/app/test_workspace_cycles_modules_project_scope_app.py",
    "plane/tests/contract/app/test_workspace_file_asset_project_scope_app.py",
    "plane/tests/contract/app/test_workspace_user_preference_app.py",
    "plane/tests/unit/bg_tasks/test_ssrf_advisories.py",
    "plane/tests/unit/bg_tasks/test_url_security.py",
    "plane/tests/unit/bg_tasks/test_work_item_link_task.py",
    "plane/tests/unit/middleware/test_api_authentication.py",
    "plane/tests/unit/middleware/test_logger.py",
    "plane/tests/unit/utils/test_order_by_sanitize.py",
    "plane/utils/ip_address.py",
    "plane/utils/issue_relation_mapper.py",
    "plane/utils/openapi/decorators.py",
    "plane/utils/order_queryset.py",
    "plane/utils/porters/exporter.py",
    "plane/utils/porters/serializers/issue.py",
    "plane/utils/url_security.py",
]

# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
# skip-magic-trailing-comma = true

# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pep8-naming]
# Allow lowercase variables like "id"
classmethod-decorators = ["classmethod", "validator", "root_validator"]

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules for tests
"tests/*" = ["E402", "F401", "F811"]
# Ignore imported but unused in __init__.py files
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
detect-same-package = true
force-wrap-aliases = true
known-first-party = ["plane"]
known-third-party = ["rest_framework"]
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50
